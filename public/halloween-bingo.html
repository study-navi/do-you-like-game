<script>
/* ハロウィンビンゴは通常のビンゴと部屋を分けるため、API の room に hw- を付ける */
(function(){
  var _f = window.fetch;
  function pre(r){ r = String(r); return r.indexOf("hw-") === 0 ? r : "hw-" + r; }
  window.fetch = function(u, o){
    try{
      if(typeof u === "string" && u.indexOf("/api/bingo/") === 0){
        u = u.replace(/([?&]room=)([^&]*)/, function(m, a, b){ return a + encodeURIComponent(pre(decodeURIComponent(b))); });
        if(o && typeof o.body === "string"){
          var j = JSON.parse(o.body);
          if(j && typeof j.room === "string"){ j.room = pre(j.room); o = Object.assign({}, o, { body: JSON.stringify(j) }); }
        }
      }
    }catch(e){}
    return _f.call(this, u, o);
  };
})();
</script>

}
function findItem(en){
  for(var i = 0; i < items.length; i++){ if(items[i].en === en) return items[i]; }
  return null;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function iconHtml(it, size){
  if(it && it.emoji) return '<span style="font-size:' + Math.round(size * 1.25) + 'px;line-height:1.1;">' + it.emoji + '</span>';
  if(!it) return "";
  return it.swatch
    ? '<span style="display:inline-block;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + it.swatch + ';border:1px solid #D3D1C7;"></span>'
    : '<i class="ti ' + it.icon + '" style="font-size:' + size + 'px;color:#E8710A;"></i>';
}
function cellFontSize(){
  if(gridSize === 3) return { icon: 22, en: 12, ja: 10, cellPx: 92 };
  if(gridSize === 4) return { icon: 18, en: 10, ja: 9, cellPx: 78 };
  return { icon: 15, en: 9, ja: 8, cellPx: 62 };
}

/* ---------- setup screen ---------- */
function resetSetupCells(){
  var n = gridSize * gridSize;
  setupCells = new Array(n).fill(null);
}
function renderSetupGrid(){
  var fs = cellFontSize();
  var grid = document.getElementById("setup-grid");
  grid.style.gridTemplateColumns = "repeat(" + gridSize + ", " + fs.cellPx + "px)";
  grid.style.gridTemplateRows = "repeat(" + gridSize + ", " + fs.cellPx + "px)";
  grid.innerHTML = "";
  setupCells.forEach(function(en, idx){
    var cell = document.createElement("div");
    cell.className = "setup-cell" + (en ? " filled" : "");
    cell.dataset.idx = idx;
    if(en){
      var it = findItem(en);
      cell.innerHTML = iconHtml(it, fs.icon) +
        '<div class="cell-en" style="font-size:' + fs.en + 'px;">' + en + '</div>' +
        '<div class="cell-ja" style="font-size:' + fs.ja + 'px;">' + it.ja + '</div>';
      cell.onclick = function(){ removeFromCell(idx); };
    } else {
      cell.onclick = function(){ placeSelectedTile(idx); };
    }
    grid.appendChild(cell);
  });
  updateFillCount();
}
function updateFillCount(){
  var filled = setupCells.filter(function(v){ return v; }).length;
  document.getElementById("fill-count").textContent = filled + " / " + setupCells.length + " まいうめた";
  document.getElementById("confirm-btn").disabled = filled < setupCells.length;
}
function renderPool(){
  var poolWrap = document.getElementById("pool-wrap");
  poolWrap.innerHTML = "";
  var used = setupCells.filter(function(v){ return v; });
  items.forEach(function(it){
    if(used.indexOf(it.en) >= 0) return;
    var tile = document.createElement("div");
    tile.className = "pool-tile";
    tile.dataset.en = it.en;
    tile.innerHTML = iconHtml(it, 14) + '<span>' + it.en + '</span>';
    tile.onclick = function(){ selectTile(it.en, tile); };
    tile.addEventListener("pointerdown", function(ev){ startDrag(ev, it.en, tile); });
    poolWrap.appendChild(tile);
  });
}
function selectTile(en, el){
  document.querySelectorAll(".pool-tile").forEach(function(t){ t.classList.remove("selected"); });
  if(selectedTile === en){ selectedTile = null; return; }
  selectedTile = en;
  el.classList.add("selected");
}
function placeSelectedTile(idx){
  if(!selectedTile) return;
  if(setupCells[idx]) return;
  setupCells[idx] = selectedTile;
  selectedTile = null;
  renderSetupGrid();
  renderPool();
}
function removeFromCell(idx){
  setupCells[idx] = null;
  renderSetupGrid();
  renderPool();
}
function randomFill(){
  var pool = items.map(function(it){ return it.en; });
  for(var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var n = gridSize * gridSize;
  setupCells = pool.slice(0, n);
  renderSetupGrid();
  renderPool();
}
window.randomFill = randomFill;
window.confirmCard = confirmCard;
window.backToSetup = backToSetup;
window.speak = speak;
window.closeBingoOverlay = closeBingoOverlay;

/* drag and drop (pointer events, touch-friendly) */
function startDrag(ev, en, sourceEl){
  ev.preventDefault();
  var ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.textContent = en;
  document.body.appendChild(ghost);
  positionGhost(ghost, ev.clientX, ev.clientY);
  sourceEl.classList.add("dragging");
  dragState = { en: en, ghost: ghost, sourceEl: sourceEl };
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragEnd);
}
function positionGhost(ghost, x, y){
  ghost.style.left = (x - ghost.offsetWidth / 2) + "px";
  ghost.style.top = (y - ghost.offsetHeight / 2 - 40) + "px";
}
function onDragMove(ev){
  if(!dragState) return;
  positionGhost(dragState.ghost, ev.clientX, ev.clientY);
}
function onDragEnd(ev){
  if(!dragState) return;
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  dragState.ghost.style.display = "none";
  var target = document.elementFromPoint(ev.clientX, ev.clientY);
  dragState.ghost.remove();
  dragState.sourceEl.classList.remove("dragging");
  var cell = target ? target.closest(".setup-cell") : null;
  if(cell && !cell.classList.contains("filled")){
    var idx = Number(cell.dataset.idx);
    setupCells[idx] = dragState.en;
    renderSetupGrid();
    renderPool();
  }
  dragState = null;
}

function confirmCard(){
  var n = gridSize * gridSize;
  if(setupCells.filter(function(v){ return v; }).length < n) return;
  boardWords = setupCells.slice();
  markedFlags = new Array(n).fill(false);
  lineHit = new Array(n).fill(false);
  calledSeen = [];
  completedLineCount = 0;
  var lcBadge = document.getElementById("line-count-badge");
  if(lcBadge){ lcBadge.style.display = "block"; lcBadge.textContent = "🎯 0本"; }
  syncBingoProgress(0, true);
  document.getElementById("screen-setup").classList.remove("active");
  document.getElementById("screen-game").classList.add("active");
  if(setupPollTimer){ clearTimeout(setupPollTimer); setupPollTimer = null; }
  renderBoard();
  pollGame();
}
function backToSetup(){
  if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
  var lcBadge2 = document.getElementById("line-count-badge");
  if(lcBadge2) lcBadge2.style.display = "none";
  document.getElementById("screen-game").classList.remove("active");
  document.getElementById("screen-setup").classList.add("active");
  resetSetupCells();
  renderSetupGrid();
  renderPool();
  pollSetupSize();
}

/* ---------- game screen ---------- */
function renderBoard(){
  var fs = cellFontSize();
  var grid = document.getElementById("board-grid");
  grid.style.gridTemplateColumns = "repeat(" + gridSize + ", " + fs.cellPx + "px)";
  grid.style.gridTemplateRows = "repeat(" + gridSize + ", " + fs.cellPx + "px)";
  grid.innerHTML = "";
  boardWords.forEach(function(en, idx){
    var it = findItem(en);
    var cell = document.createElement("div");
    var cls = "board-cell";
    if(markedFlags[idx]) cls += " marked";
    if(lineHit[idx]) cls += " line";
    cell.className = cls;
    cell.innerHTML = iconHtml(it, fs.icon) +
      '<div class="cell-en" style="font-size:' + fs.en + 'px;">' + en + '</div>' +
      '<div class="cell-ja" style="font-size:' + fs.ja + 'px;">' + (it ? it.ja : "") + '</div>';
    grid.appendChild(cell);
  });
}
function renderHistoryStrip(calledWords){
  var strip = document.getElementById("history-strip");
  strip.innerHTML = calledWords.slice().reverse().map(function(w){
    return '<span class="history-chip">' + w + '</span>';
  }).join("");
}
function checkLines(){
  var n = gridSize;
  var newlyCompleted = false;
  var totalCompleted = 0;
  function markLine(idxs){
    var allMarked = idxs.every(function(i){ return markedFlags[i]; });
    if(allMarked){
      totalCompleted++;
      idxs.forEach(function(i){ if(!lineHit[i]) newlyCompleted = true; lineHit[i] = true; });
    }
  }
  for(var r = 0; r < n; r++){
    var row = []; for(var c = 0; c < n; c++) row.push(r * n + c);
    markLine(row);
  }
  for(var c2 = 0; c2 < n; c2++){
    var col = []; for(var r2 = 0; r2 < n; r2++) col.push(r2 * n + c2);
    markLine(col);
  }
  var diag1 = []; for(var d = 0; d < n; d++) diag1.push(d * n + d);
  markLine(diag1);
  var diag2 = []; for(var d2 = 0; d2 < n; d2++) diag2.push(d2 * n + (n - 1 - d2));
  markLine(diag2);
  completedLineCount = totalCompleted;
  updateLineCountBadge();
  syncBingoProgress(completedLineCount, false);
  return newlyCompleted;
}
function updateLineCountBadge(){
  var badge = document.getElementById("line-count-badge");
  if(badge) badge.textContent = "🎯 " + completedLineCount + "本";
}
function showBingoOverlay(){
  var textEl = document.getElementById("bingo-text");
  if(textEl) textEl.innerHTML = "Happy Halloween!<br>" + completedLineCount + "ラインビンゴ！";
  document.getElementById("bingo-overlay").classList.add("show");
}
function closeBingoOverlay(){
  document.getElementById("bingo-overlay").classList.remove("show");
}
function pollGame(){
  fetch("/api/bingo/state?room=" + encodeURIComponent(currentRoom) + "&me=" + encodeURIComponent(studentId || "none"))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(studentId && d.exists === false){ forgetRegistration(); location.reload(); return; }
      if(typeof d.round === "number"){
        if(knownRound === null){ knownRound = d.round; updateRoundPill(d.round); }
        else if(d.round !== knownRound){
          knownRound = d.round;
          updateRoundPill(d.round);
          announceRound(d.round);
          leaveGame = true;
          backToSetup();
          return;
        }
      }
      var called = d.calledWords || [];
      var newWords = called.slice(calledSeen.length);
      calledSeen = called.slice();
      renderHistoryStrip(called);
      if(called.length > 0){
        var last = called[called.length - 1];
        var it = findItem(last);
        document.getElementById("latest-en").innerHTML = last +
          ' <button class="speak-btn" onclick="speak(\'' + last + '\')">🔊</button>';
        document.getElementById("latest-ja").textContent = it ? it.ja : "";
      }
      var changed = false;
      newWords.forEach(function(w){
        var idx = boardWords.indexOf(w);
        if(idx >= 0 && !markedFlags[idx]){ markedFlags[idx] = true; changed = true; }
      });
      if(newWords.length){
        speak(newWords[newWords.length - 1]);
      }
      if(changed){
        renderBoard();
        var completed = checkLines();
        renderBoard();
        if(completed) showBingoOverlay();
      }
    })
    .catch(function(){})
    .finally(function(){
      if(leaveGame){ leaveGame = false; return; }
      pollTimer = setTimeout(pollGame, 2500);
    });
}

/* setup-screen live size polling (in case teacher changes grid size while student is arranging) */
function pollSetupSize(){
  fetch("/api/bingo/state?room=" + encodeURIComponent(currentRoom) + "&me=" + encodeURIComponent(studentId || "none"))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(typeof d.round === "number"){
        if(knownRound !== null && d.round !== knownRound) announceRound(d.round);
        knownRound = d.round;
        updateRoundPill(d.round);
      }
      var newSize = d.size || 3;
      if(newSize !== gridSize){
        gridSize = newSize;
        document.getElementById("size-label").textContent = "（" + gridSize + "×" + gridSize + "）";
        resetSetupCells();
        renderSetupGrid();
        renderPool();
      } else {
        document.getElementById("size-label").textContent = "（" + gridSize + "×" + gridSize + "）";
      }
    })
    .catch(function(){})
    .finally(function(){ setupPollTimer = setTimeout(pollSetupSize, 3000); });
}

/* ---------- registration ---------- */
var capturedPhoto = null;
var STUDENT_NO_KEY = "hwbingo_student_no";
var PREV_ID_KEY = "hwbingo_prev_id";
var DEVICE_KEY = "hwbingo_device";
var registering = false;
function getDeviceId(){
  var d = "";
  try{ d = localStorage.getItem(DEVICE_KEY) || ""; }catch(e){}
  if(!d){
    d = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    try{ localStorage.setItem(DEVICE_KEY, d); }catch(e){}
  }
  return d;
}
var STUDENT_ROLE_KEY = "hwbingo_student_role";
var isTeacher = false;
function setTeacherMode(on){
  isTeacher = !!on;
  var input = document.getElementById("no-input");
  var btn = document.getElementById("teacher-btn");
  input.disabled = isTeacher;
  input.placeholder = isTeacher ? "先生として さんか" : "れい: 12";
  if(isTeacher) input.value = "";
  btn.className = "teacher-toggle" + (isTeacher ? " on" : "");
  btn.textContent = isTeacher ? "✓ 先生" : "👩‍🏫 先生";
  document.getElementById("no-label").textContent = isTeacher ? "先生として さんかします（写真で 区別します）" : "しゅっせきばんごうを えらんでね";
  renderNoPick();
}
var MAX_NO = 35;
function renderNoPick(){
  var box = document.getElementById("no-pick");
  var input = document.getElementById("no-input");
  if(!box.children.length){
    for(var n = 1; n <= MAX_NO; n++){
      (function(num){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = num;
        b.onclick = function(){
          input.value = String(num);
          document.getElementById("reg-error").textContent = "";
          renderNoPick();
        };
        box.appendChild(b);
      })(n);
    }
  }
  var cur = parseInt(input.value, 10);
  Array.prototype.forEach.call(box.children, function(b){
    b.className = (!isTeacher && parseInt(b.textContent, 10) === cur) ? "sel" : "";
  });
  box.className = "no-pick" + (isTeacher ? " off" : "");
  if(!isTeacher && cur >= 1){
    document.getElementById("no-label").textContent = "しゅっせきばんごう: " + cur + "ばん";
  }
}
function toggleTeacher(){ setTeacherMode(!isTeacher); }
function sanitizeSchool(v){ return String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16); }
function makeRoom(school, g, c){ return (school ? school + "-" : "") + g + "-" + c; }
function getSchoolFromUrl(){
  var m = location.search.match(/[?&]school=([^&]+)/);
  return m ? sanitizeSchool(decodeURIComponent(m[1])) : "";
}
var GC_KEY = "hwbingo_gc";
var selGrade = 0, selClass = 0;
function renderGC(){
  var gBox = document.getElementById("grade-pick");
  var cBox = document.getElementById("class-pick");
  function build(box, max, onPick){
    if(box.children.length) return;
    for(var n = 1; n <= max; n++){
      (function(num){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = num;
        b.onclick = function(){ onPick(num); document.getElementById("reg-error").textContent = ""; renderGC(); };
        box.appendChild(b);
      })(n);
    }
  }
  build(gBox, 6, function(n){ selGrade = n; });
  build(cBox, 8, function(n){ selClass = n; });
  Array.prototype.forEach.call(gBox.children, function(b){ b.className = parseInt(b.textContent, 10) === selGrade ? "sel" : ""; });
  Array.prototype.forEach.call(cBox.children, function(b){ b.className = parseInt(b.textContent, 10) === selClass ? "sel" : ""; });
  document.getElementById("room-input").value = (selGrade && selClass) ? makeRoom(getSchoolFromUrl(), selGrade, selClass) : "";
  document.getElementById("gc-label").textContent = (selGrade && selClass) ? (selGrade + "ねん " + selClass + "くみ") : "なんねん なんくみ？";
}

function onPhotoSelected(event){
  var file = event.target.files && event.target.files[0];
  if(!file) return;
  var err = document.getElementById("reg-error");
  err.textContent = "";
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var targetW = 320, targetH = 240;
      var canvas = document.createElement("canvas");
      canvas.width = targetW; canvas.height = targetH;
      var ctx = canvas.getContext("2d");
      var iw = img.width, ih = img.height;
      var imgAspect = iw / ih, targetAspect = targetW / targetH;
      var sx, sy, sw, sh;
      if(imgAspect > targetAspect){
        sh = ih; sw = ih * targetAspect; sx = (iw - sw) / 2; sy = 0;
      } else {
        sw = iw; sh = iw / targetAspect; sx = 0; sy = (ih - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
      capturedPhoto = canvas.toDataURL("image/jpeg", 0.75);
      document.getElementById("reg-preview").src = capturedPhoto;
      document.getElementById("reg-preview").style.display = "block";
      document.getElementById("reg-placeholder").style.display = "none";
      document.getElementById("reg-capture-btn").style.display = "none";
      document.getElementById("reg-confirm-btn").style.display = "block";
      document.getElementById("reg-retake-btn").style.display = "block";
    };
    img.onerror = function(){
      err.textContent = "しゃしんを よみこめませんでした。もう一度 おためしください。";
    };
    img.src = e.target.result;
  };
  reader.onerror = function(){
    err.textContent = "しゃしんを よみこめませんでした。もう一度 おためしください。";
  };
  reader.readAsDataURL(file);
}
function retakePhoto(){
  capturedPhoto = null;
  document.getElementById("reg-file-input").value = "";
  document.getElementById("reg-preview").style.display = "none";
  document.getElementById("reg-placeholder").style.display = "block";
  document.getElementById("reg-capture-btn").style.display = "block";
  document.getElementById("reg-confirm-btn").style.display = "none";
  document.getElementById("reg-retake-btn").style.display = "none";
}
function prefillSavedPhoto(){
  var photo = localStorage.getItem(STUDENT_PHOTO_KEY);
  if(!photo) return;
  capturedPhoto = photo;
  document.getElementById("reg-preview").src = photo;
  document.getElementById("reg-preview").style.display = "block";
  document.getElementById("reg-placeholder").style.display = "none";
  document.getElementById("reg-capture-btn").style.display = "none";
  document.getElementById("reg-confirm-btn").style.display = "block";
  document.getElementById("reg-retake-btn").style.display = "block";
  document.querySelector(".register-sub").textContent = "まえの しゃしんで よければ「これで OK」を おしてね";
}
function getRoomForRegister(){
  var u = getRoomFromUrl();
  if(u) return u;
  return document.getElementById("room-input").value;
}
function proceedToSetupScreen(){
  resetSetupCells();
  renderSetupGrid();
  renderPool();
  pollSetupSize();
}
function enterGame(room){
  currentRoom = String(room || "").trim().toLowerCase();
  localStorage.setItem(ROOM_KEY, currentRoom);
  document.getElementById("room-tag").textContent = "教室コード: " + currentRoom;
  document.getElementById("register-overlay").style.display = "none";
  proceedToSetupScreen();
}
function forgetRegistration(){
  localStorage.removeItem(STUDENT_ID_KEY);
  studentId = null;
}
function needRoom(err){
  if(!getRoomFromUrl() && !(selGrade && selClass)){
    err.textContent = "なんねん なんくみ か えらんでね";
    return true;
  }
  return false;
}
function confirmPhoto(){
  if(!capturedPhoto) return;
  var err = document.getElementById("reg-error");
  if(needRoom(err)) return;
  var no = isTeacher ? null : parseInt(document.getElementById("no-input").value, 10);
  if(!isTeacher && !(no >= 1 && no <= 99)){
    err.textContent = "しゅっせきばんごうを えらんでね";
    return;
  }
  if(registering) return;
  registering = true;
  document.getElementById("reg-confirm-btn").disabled = true;
  err.textContent = "とうろく中...";
  var room = getRoomForRegister();
  fetch("/api/bingo/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room: room, photo: capturedPhoto, no: no, role: isTeacher ? "teacher" : "student", deviceId: getDeviceId(), replaceId: localStorage.getItem(PREV_ID_KEY) || "" })
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.id) throw new Error("no id");
      registering = false;
      document.getElementById("reg-confirm-btn").disabled = false;
      studentId = d.id;
      localStorage.setItem(STUDENT_ID_KEY, studentId);
      localStorage.setItem(STUDENT_PHOTO_KEY, capturedPhoto);
      localStorage.removeItem(PREV_ID_KEY);
      localStorage.setItem(STUDENT_NO_KEY, no ? String(no) : "");
      localStorage.setItem(STUDENT_ROLE_KEY, isTeacher ? "teacher" : "student");
      if(selGrade && selClass) localStorage.setItem(GC_KEY, selGrade + "-" + selClass);
      enterGame(room);
    })
    .catch(function(){
      registering = false;
      document.getElementById("reg-confirm-btn").disabled = false;
      err.textContent = "先生のサーバーに つなげませんでした。Wi-Fiを かくにんしてください。";
    });
}
function skipRegister(){
  var err = document.getElementById("reg-error");
  if(needRoom(err)) return;
  forgetRegistration();
  enterGame(getRoomForRegister());
}
function syncBingoProgress(lineCount, reset){
  if(!studentId) return;
  fetch("/api/bingo/progress", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(reset ? { id: studentId, reset: true } : { id: studentId, lineCount: lineCount })
  }).catch(function(){});
}

(function boot(){
  document.getElementById("no-input").value = localStorage.getItem(STUDENT_NO_KEY) || "";
  var gc = (localStorage.getItem(GC_KEY) || "").split("-");
  selGrade = parseInt(gc[0], 10) || 0;
  selClass = parseInt(gc[1], 10) || 0;
  setTeacherMode(localStorage.getItem(STUDENT_ROLE_KEY) === "teacher");
  var urlRoom = getRoomFromUrl();
  if(urlRoom){
    var badge = document.getElementById("room-badge");
    badge.textContent = "きょうしつコード: " + urlRoom;
    badge.style.display = "inline-block";
  } else {
    document.getElementById("room-row").style.display = "block";
    renderGC();
  }
  var savedId = localStorage.getItem(STUDENT_ID_KEY);
  var savedRoom = localStorage.getItem(ROOM_KEY) || "";
  studentId = null;
  if(savedId && savedRoom && (!urlRoom || String(urlRoom).trim().toLowerCase() === savedRoom)){
    fetch("/api/bingo/state?room=" + encodeURIComponent(savedRoom) + "&me=" + encodeURIComponent(savedId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.exists){ studentId = savedId; enterGame(savedRoom); }
        else { forgetRegistration(); prefillSavedPhoto(); }
      })
      .catch(function(){ prefillSavedPhoto(); });
  } else {
    prefillSavedPhoto();
  }
})();
</script>

  #wc-fab { position: fixed; right: 12px; bottom: 14px; z-index: 150; border: none; border-radius: 999px; padding: 12px 16px; font-size: 15px; font-weight: 800; background: #2B1B3F; color: #FFB347; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer; }
  #wc-overlay { position: fixed; inset: 0; z-index: 450; background: rgba(43,27,63,.7); display: none; align-items: flex-end; justify-content: center; }
  #wc-sheet { background: #F4ECFA; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 14px 22px; }
  #wc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 800; color: #2B1B3F; font-size: 16px; }
  #wc-close { border: none; background: #FFFFFF; border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
  #wc-big { background: #2B1B3F; color: #FFB347; border-radius: 16px; text-align: center; padding: 12px 8px; margin-bottom: 10px; min-height: 92px; }
  #wc-big .be { font-size: 42px; line-height: 1.1; } #wc-big .bw { font-size: 26px; font-weight: 800; } #wc-big .bj { font-size: 17px; color: #E8DAF5; }
  #wc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .wc-chip { background: #FFFFFF; border: 2px solid #CBB7E8; border-radius: 12px; padding: 7px 2px 5px; text-align: center; cursor: pointer; font-family: inherit; }
  .wc-chip.sel { border-color: #E8710A; background: #FFF1E0; }
  .wc-chip .ce { font-size: 28px; line-height: 1.15; } .wc-chip .cw { font-size: 11px; font-weight: 700; color: #2C2C2A; } .wc-chip .cj { font-size: 9px; color: #888780; }

  /* ===== トレカ風（たて長・5:7）===== */
  .hcard, .slot, .wcard, .wc-chip, .g-face.g-front {
    display: flex; flex-direction: column; aspect-ratio: 5 / 7; padding: 4px 4px 5px; box-sizing: border-box;
    background: linear-gradient(170deg, #5B3A94 0%, #3B2461 100%); border: 3px solid #CBB7E8; border-radius: 12px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 2px 6px rgba(43,27,63,.25); text-align: center; position: relative; min-height: 0;
  }
  .hcard .he, .slot .se, .wcard .we, .wc-chip .ce, .g-front .ge {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-size: 34px; line-height: 1;
    background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #F1E8FB 70%, #DCCBF2 100%); border-radius: 8px; border: 2px solid rgba(43,27,63,.35);
    filter: none; opacity: 1; margin: 0;
  }
  .hcard .hw, .slot .sw, .wcard .ww, .wc-chip .cw, .g-front .gw {
    margin-top: 4px; padding: 2px 0; border-radius: 6px; background: #2B1B3F; color: #FFB347; font-size: 11px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hcard .hj, .slot .sj, .wcard .wj, .wc-chip .cj, .g-front .gj { margin-top: 2px; font-size: 9px; color: #E8DAF5; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hand-row .hcard { width: 84px; }
  .hand-row.many .hcard { width: auto; }
  .g-card { width: 92px; height: auto; aspect-ratio: 5 / 7; }
  .g-face { border-radius: 12px; }
  .g-face.g-front .ge { font-size: 38px; } .g-front .gw { font-size: 12px; }
  .g-face.g-back { border-width: 3px; }
  /* まだ手に入れていないカード */
  .slot:not(.got) { background: linear-gradient(170deg, #8C8A9A 0%, #5E5C6B 100%); border-color: #B4B2A9; box-shadow: none; }
  .slot:not(.got) .se { background: #4A4858; border-color: rgba(255,255,255,.2); filter: grayscale(1) brightness(0); opacity: .75; }
  .slot:not(.got) .sw { background: #3A3846; color: #B4B2A9; }
  .slot:not(.got) .sj { color: #D3D1C7; }
  .slot.got { background: linear-gradient(170deg, #5B3A94 0%, #3B2461 100%); border-color: #FFB347; }
  .slot.got .sw { background: #2B1B3F; color: #FFB347; } .slot.got .sj { color: #E8DAF5; }
  /* ★レア：金のふち */
  .hcard.rare, .slot.rare.got, .wcard.rare, .g-card.rare .g-front, .wc-chip.rare {
    border-color: #FFC83D; background: linear-gradient(135deg, #8A5A00 0%, #E8A400 30%, #FFE27A 50%, #E8A400 70%, #8A5A00 100%);
  }
  .hcard.rare .hw, .slot.rare.got .sw, .wcard.rare .ww, .g-card.rare .gw { background: #5A3A00; color: #FFE27A; }
  .hcard.rare .hj, .slot.rare.got .sj, .g-card.rare .gj { color: #5A3A00; font-weight: 700; }
  .slot.rare:not(.got) { border-style: solid; border-color: #C9A24A; }
  .slot .star { top: 7px; right: 9px; font-size: 13px; z-index: 4; text-shadow: 0 0 4px #fff; }
  .wcard.sel { outline: 3px solid #E8710A; outline-offset: 1px; background: linear-gradient(170deg, #E8710A 0%, #8A3F00 100%); }
  .wcard.off { opacity: .35; }
  .wc-chip.sel { outline: 3px solid #E8710A; outline-offset: 1px; }
  .want-grid, .book-grid, #wc-grid { gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hcard, .slot, .wcard, .wc-chip { min-width: 0; }

  .rtag { position: absolute; top: 5px; right: 5px; z-index: 6; padding: 1px 4px; border-radius: 4px; background: #D6002B; color: #FFFFFF; font-size: 8px; font-weight: 900; letter-spacing: .5px; line-height: 1.3; box-shadow: 0 0 0 1px #FFE27A, 0 1px 3px rgba(0,0,0,.4); pointer-events: none; }
  .slot .star { display: none; }
  .g-front .rtag { font-size: 9px; top: 6px; right: 6px; }
</style>
<button id="wc-fab" type="button">🔊 ことば</button>
<div id="wc-overlay"><div id="wc-sheet">
  <div id="wc-head"><span>🔊 ことばチェック（タップで はつおん）</span><button id="wc-close" type="button">✕</button></div>
  <div id="wc-big"><div class="bj">カードを タップすると、<br>はつおんと いみが わかるよ</div></div>
  <div id="wc-grid"></div>
</div></div>
<script>
(function(){
  function words(){
    if(window.HWC && HWC.sets && HWC.sets[3]) return HWC.sets[3].cards;
    return (typeof items !== "undefined") ? items : [];
  }
  function say(t){
    if(!("speechSynthesis" in window)) return;
    try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); }catch(e){}
  }
  var grid = document.getElementById("wc-grid"), big = document.getElementById("wc-big");
  function build(){
    grid.innerHTML = "";
    words().forEach(function(w){
      var b = document.createElement("button"); b.type = "button"; b.className = "wc-chip";
      b.className = "wc-chip" + (w.rare ? " rare" : "");
      b.innerHTML = (w.rare ? '<span class="rtag">RARE</span>' : '') + '<div class="ce">' + w.emoji + '</div><div class="cw">' + w.en + '</div><div class="cj">' + w.ja + '</div>';
      b.onclick = function(){
        Array.prototype.forEach.call(grid.children, function(x){ x.classList.remove("sel"); });
        b.classList.add("sel");
        big.innerHTML = '<div class="be">' + w.emoji + '</div><div class="bw">' + w.en + '</div><div class="bj">＝ ' + w.ja + '</div>';
        say(w.en);
      };
      grid.appendChild(b);
    });
  }
  document.getElementById("wc-fab").onclick = function(){ build(); document.getElementById("wc-overlay").style.display = "flex"; };
  function close(){ document.getElementById("wc-overlay").style.display = "none"; try{ speechSynthesis.cancel(); }catch(e){} }
  document.getElementById("wc-close").onclick = close;
  document.getElementById("wc-overlay").addEventListener("click", function(e){ if(e.target === this) close(); });
})();
</script>
</body>
</html>
