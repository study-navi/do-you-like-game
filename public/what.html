<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What do you like? ゲーム</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #F1EFE8;
    color: #2C2C2A;
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    position: relative;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .my-avatar { width: 52px; height: 39px; border-radius: 8px; object-fit: cover; border: 2px solid #185FA5; display: none; }
  .title { font-size: 22px; font-weight: 600; }
  .pills-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
  .score-pill {
    display: flex; align-items: center; gap: 8px;
    background: #FAEEDA; border-radius: 999px; padding: 8px 18px;
  }
  .score-pill i { font-size: 20px; color: #854F0B; }
  #score { font-size: 24px; font-weight: 600; color: #854F0B; }
  .score-lbl { font-size: 14px; color: #854F0B; }
  .streak-pill {
    display: flex; align-items: center; gap: 8px;
    background: #FDEDEA; border-radius: 999px; padding: 8px 18px;
  }
  .streak-pill i { font-size: 20px; color: #C2410C; }
  #streak { font-size: 24px; font-weight: 600; color: #C2410C; }
  .streak-lbl { font-size: 14px; color: #C2410C; }
  .step-label { font-size: 16px; color: #5F5E5A; margin-bottom: 14px; display: flex; align-items: center; }
  .num {
    background: #E6F1FB; color: #185FA5; border-radius: 999px;
    padding: 3px 12px; font-size: 14px; margin-right: 10px; font-weight: 500;
  }
  button { font-family: inherit; cursor: pointer; }
  .rand-btn {
    font-size: 16px; padding: 10px 20px; border-radius: 999px;
    border: 2px solid #7F77DD; color: #534AB7; background: #EEEDFE; font-weight: 500;
    transition: transform 0.1s;
  }
  .rand-btn:active { transform: scale(0.96); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 3px; -webkit-overflow-scrolling: touch; }
  .cat-tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px; border: 1px solid #D3D1C7;
    background: #FFFFFF; font-size: 14px; color: #5F5E5A; font-weight: 500;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .cat-tab i { font-size: 16px; }
  .cat-tab.active { background: #185FA5; border-color: #185FA5; color: #FFFFFF; }
  .progress-wrap { margin-bottom: 14px; }
  .progress-bar-bg { background: #EDEBE3; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar-fill { background: #378ADD; height: 100%; border-radius: 999px; transition: width 0.3s; width: 0%; }
  .progress-text { font-size: 12px; color: #888780; margin-top: 6px; text-align: right; }
  #cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px;
  }
  .card {
    position: relative;
    padding: 14px 6px; border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; gap: 5px; background: #FFFFFF; border: 1px solid #D3D1C7;
    transition: background 0.1s, transform 0.1s, opacity 0.1s;
  }
  .card:active { transform: scale(0.96); }
  .card:hover { background: #F1EFE8; }
  .card.used { opacity: 0.5; }
  .used-badge {
    position: absolute; top: 6px; right: 6px; width: 18px; height: 18px;
    border-radius: 50%; background: #1D9E75; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .card-icon { font-size: 30px; color: #185FA5; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #B4B2A9; display: inline-block; }
  .card-en { font-size: 15px; font-weight: 600; }
  .card-ja { font-size: 12px; color: #888780; }
  .chosen { text-align: center; margin-bottom: 20px; }
  .chosen-en { font-size: 26px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .chosen-ja { font-size: 14px; color: #888780; }
  .yn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn-yes, .btn-no {
    padding: 22px; font-size: 20px; border-radius: 16px; font-weight: 600;
    transition: transform 0.1s;
  }
  .btn-yes { border: 2px solid #1D9E75; color: #0F6E56; background: #E1F5EE; }
  .btn-no { border: 2px solid #D85A30; color: #993C1D; background: #FAECE7; }
  .btn-yes:active, .btn-no:active { transform: scale(0.97); }
  .btn-yes i, .btn-no i { font-size: 26px; vertical-align: -5px; margin-right: 8px; }
  .btn-sub { font-size: 14px; margin-top: 5px; font-weight: 400; }
  .question-box { background: #F1EFE8; border-radius: 16px; padding: 28px 20px; text-align: center; margin-bottom: 10px; }
  .q-hint { font-size: 14px; color: #888780; margin-bottom: 10px; }
  #question { font-size: 28px; font-weight: 600; line-height: 1.4; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; }
  #question .hl { color: #185FA5; }
  #prediction-badge { margin-top: 14px; font-size: 15px; color: #5F5E5A; }
  .result-box { border-radius: 16px; padding: 32px 20px; margin-bottom: 18px; text-align: center; }
  .result-box i { font-size: 48px; }
  .result-title { font-size: 28px; font-weight: 600; margin: 10px 0 6px; }
  .result-sub { font-size: 17px; }
  .streak-msg { margin-top: 12px; font-size: 15px; color: #C2410C; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .next-btn {
    padding: 14px 36px; font-size: 17px; border-radius: 999px; font-weight: 500;
    border: 1px solid #888780; background: #FFFFFF; color: #2C2C2A; transition: transform 0.1s;
  }
  .next-btn:active { transform: scale(0.97); }
  .next-btn i { font-size: 19px; vertical-align: -3px; margin-right: 6px; }
  .center { text-align: center; }
  .footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .reset-btn { font-size: 14px; padding: 8px 16px; color: #888780; background: none; border: none; }
  .reset-btn:hover { color: #5F5E5A; text-decoration: underline; }
  .retake-link { font-size: 13px; padding: 8px 16px; color: #888780; background: none; border: none; }
  .retake-link:hover { color: #5F5E5A; text-decoration: underline; }
  .mt16 { margin-top: 18px; }
  .speak-btn {
    border: none; background: #EEEDFE; color: #534AB7; width: 32px; height: 32px;
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1; flex: 0 0 auto; transition: transform 0.1s;
  }
  .speak-btn:active { transform: scale(0.9); }
  .step-nav { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .back-btn, .cancel-btn {
    font-size: 14px; padding: 9px 18px; border-radius: 999px; font-weight: 500;
    border: 1px solid #D3D1C7; background: #FFFFFF; color: #5F5E5A;
    transition: transform 0.1s;
  }
  .back-btn:active, .cancel-btn:active { transform: scale(0.96); }
  .back-btn i, .cancel-btn i { font-size: 15px; vertical-align: -2px; margin-right: 5px; }
  .cancel-btn { color: #993C1D; border-color: #E9B9A8; }

  /* ---- registration overlay ---- */
  .register-overlay {
    position: fixed; inset: 0; background: rgba(44,44,42,0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .register-card {
    background: #FFFFFF; border-radius: 20px; padding: 24px; width: 100%; max-width: 420px;
    text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .register-title { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
  .register-sub { font-size: 13px; color: #888780; margin-bottom: 14px; }
  .reg-frame {
    width: 100%; aspect-ratio: 4 / 3; background: #F1EFE8; border-radius: 16px;
    overflow: hidden; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;
  }
  .reg-frame video, .reg-frame img { width: 100%; height: 100%; object-fit: cover; }
  .register-actions { display: flex; flex-direction: column; gap: 10px; }
  .reg-btn-primary {
    padding: 14px; font-size: 16px; border-radius: 999px; font-weight: 600;
    border: 2px solid #7F77DD; color: #534AB7; background: #EEEDFE;
  }
  .reg-btn-confirm {
    padding: 14px; font-size: 16px; border-radius: 999px; font-weight: 600;
    border: 2px solid #1D9E75; color: #0F6E56; background: #E1F5EE;
  }
  .reg-btn-secondary {
    padding: 10px; font-size: 14px; border-radius: 999px; font-weight: 500;
    border: 1px solid #D3D1C7; color: #5F5E5A; background: #FFFFFF;
  }
  .reg-error { color: #993C1D; font-size: 13px; margin-top: 10px; min-height: 16px; }
  .no-flex { display: flex; gap: 8px; }
  .teacher-toggle {
    flex: 0 0 auto; padding: 0 14px; border-radius: 10px; border: 1px solid #D3D1C7;
    background: #FFFFFF; color: #5F5E5A; font-size: 14px; font-weight: 600;
  }
  .teacher-toggle.on { background: #EEEDFE; border-color: #7F77DD; color: #534AB7; }
  .register-card { max-height: calc(100vh - 32px); overflow-y: auto; }
  .no-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .no-pick button {
    padding: 9px 0; border-radius: 10px; border: 1px solid #D3D1C7; background: #FFFFFF;
    font-size: 17px; font-weight: 700; color: #2C2C2A; transition: transform 0.1s;
  }
  .no-pick button:active { transform: scale(0.92); }
  .no-pick button.sel { background: #185FA5; border-color: #185FA5; color: #FFFFFF; }
  .no-pick.off { opacity: 0.3; pointer-events: none; }
  #teacher-btn { width: 100%; padding: 10px 14px; }
  .reg-skip { margin-top: 14px; font-size: 12px; color: #B4B2A9; background: none; border: none; text-decoration: underline; }
  /* ---- What do you like? 追加分 ---- */
  .emoji { font-size: 34px; line-height: 1; }
  #cards { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .topic-card { padding: 18px 8px; }
  .topic-card .card-en { font-size: 17px; }
  .topic-sample { font-size: 22px; letter-spacing: 2px; }
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
  .word-btn {
    padding: 10px 4px; border-radius: 12px; border: 1px solid #D3D1C7; background: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform 0.1s, background 0.1s; color: #2C2C2A;
  }
  .word-btn:active { transform: scale(0.95); }
  .word-btn:hover { background: #F1EFE8; }
  .word-btn .emoji { font-size: 28px; }
  .word-btn .swatch { width: 28px; height: 28px; }
  .w-en { font-size: 13px; font-weight: 600; }
  .w-ja { font-size: 11px; color: #888780; }
  .word-btn.other { justify-content: center; color: #5F5E5A; font-size: 13px; background: #F1EFE8; }
  .answer-line { font-size: 22px; font-weight: 600; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .tip-box { margin: 0 auto 18px; max-width: 460px; background: #EEEDFE; color: #534AB7; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.7; }
  .point-note { font-size: 12px; color: #888780; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">

  <div id="register-overlay" class="register-overlay">
    <div class="register-card">
      <div class="register-title">📷 なまえカードを うつしてね</div>
      <div class="register-sub">紙に なまえを かいて、しゃしんを とってください</div>
      <div id="room-badge" style="font-size:13px;color:#185FA5;background:#E6F1FB;border-radius:999px;padding:6px 14px;margin-bottom:14px;display:none;"></div>
      <div id="room-row" style="margin-bottom:16px;display:none;text-align:left;">
        <label style="font-size:13px;color:#5F5E5A;display:block;margin-bottom:6px;">きょうしつコード（せんせいに きいてね）</label>
        <input type="text" id="room-input" placeholder="れい: 3-1" style="width:100%;padding:10px;border-radius:10px;border:1px solid #D3D1C7;font-size:15px;box-sizing:border-box;text-align:center;">
      </div>
      <div id="no-row" style="margin-bottom:14px;text-align:left;">
        <label id="no-label" style="font-size:14px;color:#5F5E5A;display:block;margin-bottom:8px;font-weight:600;">しゅっせきばんごうを えらんでね</label>
        <input type="hidden" id="no-input" value="">
        <div id="no-pick" class="no-pick"></div>
        <button type="button" id="teacher-btn" class="teacher-toggle" onclick="toggleTeacher()">👩‍🏫 先生</button>
      </div>
      <div class="reg-frame" id="reg-frame">
        <div id="reg-placeholder" style="color:#B4B2A9;font-size:13px;padding:0 16px;text-align:center;">まだ しゃしんが ありません</div>
        <img id="reg-preview" style="display:none;">
      </div>
      <input type="file" id="reg-file-input" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoSelected(event)">
      <div class="register-actions">
        <button id="reg-capture-btn" class="reg-btn-primary" onclick="document.getElementById('reg-file-input').click()">
          <i class="ti ti-camera" style="vertical-align:-3px;margin-right:6px;"></i>しゃしんを とる
        </button>
        <button id="reg-confirm-btn" class="reg-btn-confirm" style="display:none;" onclick="confirmPhoto()">これで OK</button>
        <button id="reg-retake-btn" class="reg-btn-secondary" style="display:none;" onclick="retakePhoto()">とりなおす</button>
      </div>
      <div class="reg-error" id="reg-error"></div>
      <button class="reg-skip" onclick="skipRegister()">せんせいを よばずに あそぶ（きろくは のこりません）</button>
    </div>
  </div>

  <div id="finish-overlay" class="register-overlay" style="display:none;">
    <div class="register-card">
      <div class="register-title">🏁 けっかはっぴょう</div>
      <div id="finish-rank" style="font-size:30px;font-weight:700;color:#185FA5;margin:10px 0 6px;">-</div>
      <div id="finish-score" style="font-size:16px;color:#5F5E5A;margin-bottom:14px;">-</div>
      <div id="finish-top" style="font-size:14px;color:#5F5E5A;text-align:left;line-height:1.9;"></div>
    </div>
  </div>

  <div class="header">
    <div class="title-row">
      <img id="my-avatar" class="my-avatar" alt="">
      <div class="title">What do you like? ゲーム</div>
    </div>
    <div class="pills-wrap">
      <div class="score-pill">
        <i class="ti ti-star"></i>
        <span id="score">0</span>
        <span class="score-lbl">ポイント</span>
      </div>
      <div class="streak-pill" id="streak-pill" title="さいこう記録: 0れんぞく">
        <i class="ti ti-flame"></i>
        <span id="streak">0</span>
        <span class="streak-lbl">れんぞく</span>
      </div>
    </div>
  </div>

  <div id="step1">
    <div class="top-row">
      <div class="step-label"><span class="num">1</span>しつもんカードを えらぼう</div>
      <button id="rand-btn" class="rand-btn" onclick="randomPick()">
        <i class="ti ti-dice-5" style="font-size:18px;vertical-align:-3px;margin-right:6px;"></i>ランダムにえらぶ
      </button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
    <div id="cards"></div>
    <div class="point-note">きけたら +1ポイント、よそうが あたったら さらに +2ポイント！</div>
  </div>

  <div id="step2" style="display:none;">
    <div class="step-label"><span class="num">2</span>友だちの すきなものを よそうしよう</div>
    <div id="chosen1" class="chosen"></div>
    <div id="predict-grid" class="word-grid"></div>
    <div class="step-nav">
      <button class="back-btn" onclick="backToStep1()"><i class="ti ti-arrow-left"></i>もどる</button>
      <button class="cancel-btn" onclick="cancelPick()"><i class="ti ti-x"></i>とりけす</button>
    </div>
  </div>

  <div id="step3" style="display:none;">
    <div class="step-label"><span class="num">3</span>友だちに きいてみよう</div>
    <div class="question-box">
      <div class="q-hint">大きなこえで</div>
      <div id="question"></div>
      <div id="prediction-badge"></div>
    </div>
    <div class="step-label mt16">友だちの こたえは？「I like ～.」</div>
    <div id="answer-grid" class="word-grid"></div>
    <div class="step-nav">
      <button class="back-btn" onclick="backToStep2()"><i class="ti ti-arrow-left"></i>もどる</button>
      <button class="cancel-btn" onclick="cancelPick()"><i class="ti ti-x"></i>とりけす</button>
    </div>
  </div>

  <div id="step4" style="display:none;" class="center">
    <div id="result-box" class="result-box"></div>
    <div class="tip-box">💬 こんどは あなたが きかれる ばん！<br>「I like ～.」で こたえてあげよう</div>
    <button class="next-btn" onclick="reset()">
      <i class="ti ti-refresh"></i>つぎの友だちへ
    </button>
  </div>

  <div class="footer">
    <button class="retake-link" onclick="reRegister()">べつのカードで とりなおす</button>
    <button class="reset-btn" onclick="resetAll()">スコア・記録を ぜんぶ 0にもどす</button>
  </div>
</div>

<script>
/* ===== レッツトライ1 Unit5「What do you like?」の単語 ===== */
var items = [
  // いろ
  {en:"red", ja:"あか", swatch:"#E24B4A", category:"color"},
  {en:"blue", ja:"あお", swatch:"#378ADD", category:"color"},
  {en:"yellow", ja:"きいろ", swatch:"#FAC775", category:"color"},
  {en:"green", ja:"みどり", swatch:"#639922", category:"color"},
  {en:"pink", ja:"ピンク", swatch:"#ED93B1", category:"color"},
  {en:"purple", ja:"むらさき", swatch:"#7F77DD", category:"color"},
  {en:"orange", ja:"オレンジ", swatch:"#EF9F27", category:"color"},
  {en:"black", ja:"くろ", swatch:"#2C2C2A", category:"color"},
  {en:"white", ja:"しろ", swatch:"#FFFFFF", category:"color"},
  {en:"brown", ja:"ちゃいろ", swatch:"#8B5A2B", category:"color"},
  // スポーツ
  {en:"soccer", ja:"サッカー", emoji:"⚽", category:"sport"},
  {en:"baseball", ja:"やきゅう", emoji:"⚾", category:"sport"},
  {en:"basketball", ja:"バスケットボール", emoji:"🏀", category:"sport"},
  {en:"volleyball", ja:"バレーボール", emoji:"🏐", category:"sport"},
  {en:"tennis", ja:"テニス", emoji:"🎾", category:"sport"},
  {en:"table tennis", ja:"たっきゅう", emoji:"🏓", category:"sport"},
  {en:"dodgeball", ja:"ドッジボール", emoji:"🔴", category:"sport"},
  {en:"swimming", ja:"すいえい", emoji:"🏊", category:"sport"},
  // くだもの
  {en:"apples", ja:"りんご", emoji:"🍎", category:"fruit"},
  {en:"bananas", ja:"バナナ", emoji:"🍌", category:"fruit"},
  {en:"strawberries", ja:"いちご", emoji:"🍓", category:"fruit"},
  {en:"grapes", ja:"ぶどう", emoji:"🍇", category:"fruit"},
  {en:"melons", ja:"メロン", emoji:"🍈", category:"fruit"},
  {en:"peaches", ja:"もも", emoji:"🍑", category:"fruit"},
  {en:"oranges", ja:"オレンジ", emoji:"🍊", category:"fruit"},
  {en:"lemons", ja:"レモン", emoji:"🍋", category:"fruit"},
  {en:"cherries", ja:"さくらんぼ", emoji:"🍒", category:"fruit"},
  {en:"pineapples", ja:"パイナップル", emoji:"🍍", category:"fruit"},
  {en:"kiwi fruits", ja:"キウイ", emoji:"🥝", category:"fruit"},
  // やさい
  {en:"tomatoes", ja:"トマト", emoji:"🍅", category:"vegetable"},
  {en:"carrots", ja:"にんじん", emoji:"🥕", category:"vegetable"},
  {en:"potatoes", ja:"じゃがいも", emoji:"🥔", category:"vegetable"},
  {en:"onions", ja:"たまねぎ", emoji:"🧅", category:"vegetable"},
  {en:"cucumbers", ja:"きゅうり", emoji:"🥒", category:"vegetable"},
  {en:"corn", ja:"とうもろこし", emoji:"🌽", category:"vegetable"},

/* しつもんカード（What ___ do you like?） */
var topics = [
  {id:"color",     q:"color",     ja:"すきな いろ",       sample:"🔴🔵🟡"},
  {id:"sport",     q:"sport",     ja:"すきな スポーツ",   sample:"⚽⚾🏀"},
  {id:"fruit",     q:"fruit",     ja:"すきな くだもの",   sample:"🍎🍓🍇"},
  {id:"vegetable", q:"vegetable", ja:"すきな やさい",     sample:"🍅🥕🌽"},
  {id:"food",      q:"food",      ja:"すきな たべもの",   sample:"🍕🍔🍦"},
  {id:"animal",    q:"animal",    ja:"すきな どうぶつ",   sample:"🐶🐱🐼"}
];

var GOAL = 10; // 目標：きく人数（進みぐあいバーの目安）

var STORAGE_KEY = "whatdoyoulike_game_v1";
var STUDENT_ID_KEY = "whatdoyoulike_student_id";
var STUDENT_PHOTO_KEY = "whatdoyoulike_student_photo";
var STUDENT_ROOM_KEY = "whatdoyoulike_student_room";
var STUDENT_NO_KEY = "whatdoyoulike_student_no";
var PREV_ID_KEY = "whatdoyoulike_prev_id";
var STUDENT_ROLE_KEY = "whatdoyoulike_student_role";
var isTeacher = false;
function setTeacherMode(on){
  isTeacher = !!on;
  var input = document.getElementById("no-input");
  var btn = document.getElementById("teacher-btn");
  input.disabled = isTeacher;
  input.placeholder = isTeacher ? "先生として さんか" : "れい: 12";
  if(isTeacher) input.value = "";
  btn.className = "teacher-toggle" + (isTeacher ? " on" : "");
  btn.textContent = isTeacher ? "✓ 先生" : "👩‍🏫 先生";
  document.getElementById("no-label").textContent = isTeacher ? "先生として さんかします（写真で 区別します）" : "しゅっせきばんごうを えらんでね";
  renderNoPick();
}
var MAX_NO = 35;
function renderNoPick(){
  var box = document.getElementById("no-pick");
  var input = document.getElementById("no-input");
  if(!box.children.length){
    for(var n = 1; n <= MAX_NO; n++){
      (function(num){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = num;
        b.onclick = function(){
          input.value = String(num);
          document.getElementById("reg-error").textContent = "";
          renderNoPick();
        };
        box.appendChild(b);
      })(n);
    }
  }
  var cur = parseInt(input.value, 10);
  Array.prototype.forEach.call(box.children, function(b){
    b.className = (!isTeacher && parseInt(b.textContent, 10) === cur) ? "sel" : "";
  });
  box.className = "no-pick" + (isTeacher ? " off" : "");
  if(!isTeacher && cur >= 1){
    document.getElementById("no-label").textContent = "しゅっせきばんごう: " + cur + "ばん";
  }
}
function toggleTeacher(){ setTeacherMode(!isTeacher); }
var API = "/api/what";
var myRoom = "";
var finishPollTimer = null;
var isGameFinished = false;

var score = 0, currentTopic = null, myPredict = null, spinning = false;
var streak = 0, best = 0, asked = 0;
var topicCount = {};
var cardEls = [];
var audioCtx = null;
var studentId = null;
var capturedPhoto = null;

var grid = document.getElementById("cards");

/* ---------- room code ---------- */
function getRoomFromUrl(){
  var m = location.search.match(/[?&]room=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
function getRoomForRegister(){
  var urlRoom = getRoomFromUrl();
  if(urlRoom) return urlRoom;
  var input = document.getElementById("room-input");
  return input ? input.value : "";
}

/* ---------- storage ---------- */
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var d = JSON.parse(raw);
      score = d.score || 0;
      streak = d.streak || 0;
      best = d.best || 0;
      asked = d.asked || 0;
      topicCount = d.topicCount || {};
    }
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      score: score, streak: streak, best: best, asked: asked, topicCount: topicCount
    }));
  }catch(e){}
}

/* ---------- server sync (for teacher / TV view) ---------- */
function syncEvent(payload){
  if(!studentId) return;
  payload.id = studentId;
  fetch(API + "/event", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  }).catch(function(){});
}

/* ---------- registration ---------- */
function onPhotoSelected(event){
  var file = event.target.files && event.target.files[0];
  if(!file) return;
  var err = document.getElementById("reg-error");
  err.textContent = "";
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var targetW = 320, targetH = 240;
      var canvas = document.createElement("canvas");
      canvas.width = targetW; canvas.height = targetH;
      var ctx = canvas.getContext("2d");
      var iw = img.width, ih = img.height;
      var imgAspect = iw / ih, targetAspect = targetW / targetH;
      var sx, sy, sw, sh;
      if(imgAspect > targetAspect){
        sh = ih; sw = ih * targetAspect; sx = (iw - sw) / 2; sy = 0;
      } else {
        sw = iw; sh = iw / targetAspect; sx = 0; sy = (ih - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
      capturedPhoto = canvas.toDataURL("image/jpeg", 0.75);
      document.getElementById("reg-preview").src = capturedPhoto;
      document.getElementById("reg-preview").style.display = "block";
      document.getElementById("reg-placeholder").style.display = "none";
      document.getElementById("reg-capture-btn").style.display = "none";
      document.getElementById("reg-confirm-btn").style.display = "block";
      document.getElementById("reg-retake-btn").style.display = "block";
    };
    img.onerror = function(){
      err.textContent = "しゃしんを よみこめませんでした。もう一度 おためしください。";
    };
    img.src = e.target.result;
  };
  reader.onerror = function(){
    err.textContent = "しゃしんを よみこめませんでした。もう一度 おためしください。";
  };
  reader.readAsDataURL(file);
}
function retakePhoto(){
  capturedPhoto = null;
  document.getElementById("reg-file-input").value = "";
  document.getElementById("reg-preview").style.display = "none";
  document.getElementById("reg-placeholder").style.display = "block";
  document.getElementById("reg-capture-btn").style.display = "block";
  document.getElementById("reg-confirm-btn").style.display = "none";
  document.getElementById("reg-retake-btn").style.display = "none";
}
function confirmPhoto(){
  if(!capturedPhoto) return;
  var err = document.getElementById("reg-error");
  var no = isTeacher ? null : parseInt(document.getElementById("no-input").value, 10);
  if(!isTeacher && !(no >= 1 && no <= 99)){
    err.textContent = "しゅっせきばんごうを えらんでね";
    document.getElementById("no-input").focus();
    return;
  }
  err.textContent = "とうろく中...";
  fetch(API + "/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ photo: capturedPhoto, total: GOAL, room: getRoomForRegister(), no: no, role: isTeacher ? "teacher" : "student", replaceId: localStorage.getItem(PREV_ID_KEY) || "" })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.id) throw new Error("no id");
      localStorage.setItem(STUDENT_ID_KEY, d.id);
      localStorage.setItem(STUDENT_PHOTO_KEY, capturedPhoto);
      localStorage.setItem(STUDENT_ROOM_KEY, d.room || getRoomForRegister());
      studentId = d.id;
      myRoom = d.room || getRoomForRegister();
      localStorage.removeItem(PREV_ID_KEY);
      localStorage.setItem(STUDENT_NO_KEY, no ? String(no) : "");
      localStorage.setItem(STUDENT_ROLE_KEY, isTeacher ? "teacher" : "student");
      finishRegister();
      syncEvent({ score: score, streak: streak, best: best, used: asked, total: GOAL, status: "とうろくしました" });
    })
    .catch(function(){
      err.textContent = "先生のサーバーに つなげませんでした。Wi-Fiを かくにんしてください。";
    });
}
function skipRegister(){
  studentId = null;
  finishRegister();
}
function finishRegister(){
  document.getElementById("register-overlay").style.display = "none";
  var photo = localStorage.getItem(STUDENT_PHOTO_KEY);
  if(photo && studentId){
    var av = document.getElementById("my-avatar");
    av.src = photo;
    av.style.display = "inline-block";
  }
  initGame();
  startFinishPoll();
}

/* ---------- game finished (teacher pressed 終了する) ---------- */
function startFinishPoll(){
  if(!studentId || finishPollTimer) return;
  checkFinishState();
  finishPollTimer = setInterval(checkFinishState, 4000);
}
function checkFinishState(){
  if(!studentId) return;
  fetch(API + "/state?room=" + encodeURIComponent(myRoom))
    .then(function(r){ return r.json(); })
    .then(function(d){
      isGameFinished = !!d.finished;
      if(isGameFinished){
        showFinishOverlay(d.students || []);
      } else {
        hideFinishOverlay();
      }
    })
    .catch(function(){});
}
function showFinishOverlay(students){
  var idx = students.findIndex(function(s){ return s.id === studentId; });
  var me = idx >= 0 ? students[idx] : null;
  var rankText = me ? ("あなたは " + me.rank + " 位 / " + students.length + "人中") : "じゅんい: -";
  document.getElementById("finish-rank").textContent = rankText;
  document.getElementById("finish-score").textContent = (me ? me.score : score) + " ポイント（" + asked + "人に きいたよ）";
  var top = students.slice(0, 3).map(function(s, i){
    return (["🥇","🥈","🥉"][i] || "") + " " + s.score + " pt";
  });
  document.getElementById("finish-top").innerHTML = top.length ? ("じょうい:<br>" + top.join("<br>")) : "";
  document.getElementById("finish-overlay").style.display = "flex";
}
function hideFinishOverlay(){
  document.getElementById("finish-overlay").style.display = "none";
}
function reRegister(){
  if(!confirm("なまえカードを とりなおしますか？")) return;
  var oldId = localStorage.getItem(STUDENT_ID_KEY);
  if(oldId) localStorage.setItem(PREV_ID_KEY, oldId);
  localStorage.removeItem(STUDENT_ID_KEY);
  localStorage.removeItem(STUDENT_PHOTO_KEY);
  location.reload();
}

/* ---------- audio ---------- */
function ensureAudio(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
}
function beep(freq, dur, type){
  ensureAudio();
  if(!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.16, audioCtx.currentTime);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur);
}
function playCorrect(){ beep(660, 0.12); setTimeout(function(){ beep(880, 0.18); }, 110); setTimeout(function(){ beep(1175, 0.22); }, 230); }
function playAsked(){ beep(523, 0.12); setTimeout(function(){ beep(659, 0.16); }, 110); }

/* ---------- speech ---------- */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function questionText(t){ return "What " + t.q + " do you like?"; }
function speakQuestion(){ if(currentTopic) speak(questionText(currentTopic)); }
function speakAnswer(i){ speak("I like " + items[i].en + "."); }

/* ---------- helpers ---------- */
function visual(it, size){
  if(it.swatch){
    var s = size || 28;
    return '<span class="swatch" style="width:'+s+'px;height:'+s+'px;background:'+it.swatch+';"></span>';
  }
  return '<span class="emoji"' + (size ? ' style="font-size:'+size+'px"' : '') + '>' + it.emoji + '</span>';
}
function topicItems(t){
  var arr = [];
  items.forEach(function(it, idx){ if(it.category === t.id) arr.push(idx); });
  return arr;
}
function qHtml(t){
  return 'What <span class="hl">' + t.q + '</span> do you like?' +
    ' <button class="speak-btn" onclick="speakQuestion()" aria-label="発音を聞く">🔊</button>';
}

/* ---------- rendering ---------- */
function renderCards(){
  grid.innerHTML = "";
  cardEls = [];
  topics.forEach(function(t, idx){
    var n = topicCount[t.id] || 0;
    var b = document.createElement("button");
    b.className = "card topic-card";
    var badge = n ? '<span class="used-badge" style="width:auto;padding:0 6px;border-radius:9px;">' + n + '</span>' : "";
    b.innerHTML = badge + '<span class="topic-sample">' + t.sample + '</span>' +
      '<span class="card-en">What ' + t.q + '<br>do you like?</span>' +
      '<span class="card-ja">' + t.ja + '</span>';
    b.onclick = function(){ if(!spinning) pick(idx); };
    grid.appendChild(b);
    cardEls.push(b);
  });
  updateProgress();
}

function updateProgress(){
  var pct = Math.min(100, Math.round(asked / GOAL * 100));
  document.getElementById("progress-fill").style.width = pct + "%";
  var text = asked >= GOAL
    ? "🎉 " + asked + "人に きけたよ！ まだまだ つづけよう"
    : asked + " / " + GOAL + " 人に きいたよ";
  document.getElementById("progress-text").textContent = text;
}

function updateStreakUI(){
  document.getElementById("streak").textContent = streak;
  document.getElementById("streak-pill").title = "さいこう記録: " + best + "れんぞく";
}

function highlight(pos, on){
  cardEls[pos].style.background = on ? "#E6F1FB" : "";
  cardEls[pos].style.borderColor = on ? "#378ADD" : "#D3D1C7";
}

function randomPick(){
  if(spinning) return;
  spinning = true;
  document.getElementById("rand-btn").style.opacity = "0.5";
  var total = 14 + Math.floor(Math.random()*topics.length);
  var step = 0, prev = -1, delay = 60;
  function tick(){
    if(prev >= 0) highlight(prev, false);
    var pos = step % topics.length;
    highlight(pos, true);
    prev = pos;
    step++;
    if(step <= total){
      if(total - step < 6) delay += 50;
      setTimeout(tick, delay);
    } else {
      setTimeout(function(){
        highlight(prev, false);
        spinning = false;
        document.getElementById("rand-btn").style.opacity = "1";
        pick(prev);
      }, 450);
    }
  }
  tick();
}

function show(id){
  ["step1","step2","step3","step4"].forEach(function(s){
    document.getElementById(s).style.display = (s===id) ? "block" : "none";
  });
  window.scrollTo(0, 0);
}

function wordButton(idx, onclick){
  var it = items[idx];
  var b = document.createElement("button");
  b.className = "word-btn";
  b.innerHTML = visual(it) + '<span class="w-en">' + it.en + '</span><span class="w-ja">' + it.ja + '</span>';
  b.onclick = onclick;
  return b;
}

function otherButton(onclick){
  var b = document.createElement("button");
  b.className = "word-btn other";
  b.innerHTML = '<span class="emoji">❓</span><span class="w-en">そのほか</span><span class="w-ja">カードに ないもの</span>';
  b.onclick = onclick;
  return b;
}

function pick(i){
  currentTopic = topics[i];
  myPredict = null;
  document.getElementById("chosen1").innerHTML =
    '<div class="topic-sample" style="font-size:36px;">' + currentTopic.sample + '</div>' +
    '<div class="chosen-en" style="font-size:24px;">' + qHtml(currentTopic) + '</div>' +
    '<div class="chosen-ja">「' + currentTopic.ja + 'は なに？」と きくよ。友だちは なんて こたえるかな？</div>';
  var pg = document.getElementById("predict-grid");
  pg.innerHTML = "";
  topicItems(currentTopic).forEach(function(idx){
    pg.appendChild(wordButton(idx, function(){ predict(idx); }));
  });
  pg.appendChild(otherButton(function(){ predict(-1); }));
  show("step2");
  speakQuestion();
  syncEvent({ status: "「What " + currentTopic.q + " do you like?」に ちょうせんちゅう" });
}

function predict(idx){
  myPredict = idx;
  document.getElementById("question").innerHTML = qHtml(currentTopic);
  document.getElementById("prediction-badge").innerHTML = idx >= 0
    ? 'あなたの よそう: ' + visual(items[idx], 20) + ' <span style="font-weight:600;">I like ' + items[idx].en + '.</span>'
    : 'あなたの よそう: ❓ <span style="font-weight:600;">そのほか</span>（カードに ないもの）';
  var ag = document.getElementById("answer-grid");
  ag.innerHTML = "";
  topicItems(currentTopic).forEach(function(i){
    ag.appendChild(wordButton(i, function(){ answer(i); }));
  });
  ag.appendChild(otherButton(function(){ answer(-1); }));
  show("step3");
  speakQuestion();
}

function answer(a){
  var hit = (a === myPredict);
  var gained = hit ? 3 : 1;
  score += gained;
  asked++;
  topicCount[currentTopic.id] = (topicCount[currentTopic.id] || 0) + 1;
  var box = document.getElementById("result-box");
  var ansLine = a >= 0
    ? '<div class="answer-line">' + visual(items[a], 30) + ' I like ' + items[a].en + '.' +
      ' <button class="speak-btn" onclick="speakAnswer(' + a + ')" aria-label="発音を聞く">🔊</button></div>'
    : '<div class="answer-line" style="font-size:16px;">友だちの すきなものを おしえてもらえたね！</div>';
  if(hit){
    streak++;
    if(streak > best) best = streak;
    playCorrect();
    box.style.background = "#E1F5EE";
    var streakMsg = streak >= 2
      ? '<div class="streak-msg"><i class="ti ti-flame"></i>' + streak + 'れんぞく あたり！</div>'
      : '';
    box.innerHTML = '<i class="ti ti-confetti" style="color:#0F6E56;"></i>'
      + '<div class="result-title" style="color:#0F6E56;">あたり!</div>'
      + '<div class="result-sub" style="color:#085041;">よそうが 当たったよ +3ポイント</div>'
      + ansLine + streakMsg;
  } else {
    streak = 0;
    playAsked();
    box.style.background = "#FAEEDA";
    box.innerHTML = '<i class="ti ti-message-heart" style="color:#854F0B;"></i>'
      + '<div class="result-title" style="color:#854F0B;">きけたね!</div>'
      + '<div class="result-sub" style="color:#633806;">英語で きけたから +1ポイント</div>'
      + ansLine;
  }
  if(a >= 0) setTimeout(function(){ speakAnswer(a); }, 450);
  document.getElementById("score").textContent = score;
  updateStreakUI();
  saveState();
  renderCards();
  show("step4");
  syncEvent({
    score: score, streak: streak, best: best, used: asked, total: GOAL,
    status: hit ? "⭕ よそう あたり！" : (a >= 0 ? "💬 きけた！（I like " + items[a].en + ".）" : "💬 友だちに きけた")
  });
}

function reset(){ currentTopic = null; myPredict = null; show("step1"); }
function backToStep1(){ show("step1"); }
function backToStep2(){ show("step2"); }

function cancelPick(){
  if(currentTopic){
    syncEvent({ status: "しつもんカードを えらびなおし中" });
  }
  currentTopic = null;
  myPredict = null;
  show("step1");
}

function resetAll(){
  if(!confirm("スコア・れんぞく記録・きいた人数を ぜんぶ 0に もどしますか？")) return;
  score = 0; streak = 0; best = 0; asked = 0; topicCount = {};
  document.getElementById("score").textContent = 0;
  updateStreakUI();
  saveState();
  renderCards();
  reset();
  syncEvent({ score: 0, streak: 0, best: 0, used: 0, total: GOAL, status: "リセットしました" });
}

/* ---------- init ---------- */
function initGame(){
  loadState();
  renderCards();
  updateStreakUI();
  document.getElementById("score").textContent = score;
}

(function boot(){
  document.getElementById("no-input").value = localStorage.getItem(STUDENT_NO_KEY) || "";
  setTeacherMode(localStorage.getItem(STUDENT_ROLE_KEY) === "teacher");
  var urlRoom = getRoomFromUrl();
  if(urlRoom){
    var badge = document.getElementById("room-badge");
    badge.textContent = "きょうしつコード: " + urlRoom;
    badge.style.display = "inline-block";
  } else {
    document.getElementById("room-row").style.display = "block";
  }
  studentId = localStorage.getItem(STUDENT_ID_KEY);
  if(studentId){
    myRoom = localStorage.getItem(STUDENT_ROOM_KEY) || getRoomFromUrl();
    var photo = localStorage.getItem(STUDENT_PHOTO_KEY);
    if(photo){
      var av = document.getElementById("my-avatar");
      av.src = photo;
      av.style.display = "inline-block";
    }
    document.getElementById("register-overlay").style.display = "none";
    initGame();
    startFinishPoll();
  }
})();
</script>
