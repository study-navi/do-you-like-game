<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イニシャルカード交換 ランキング - ALPHABET</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #1B1A2E; color: #FFFFFF; margin: 0; padding: 40px;
  }
  .title { font-size: 42px; font-weight: 700; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
  .board { display: flex; flex-direction: column; gap: 14px; max-width: 1000px; margin: 0 auto; }
  .row {
    display: flex; align-items: center; gap: 22px; background: #26254A;
    border-radius: 20px; padding: 16px 28px;
  }
  .row.top1 { background: linear-gradient(90deg, #4A3F1E, #26254A); border: 2px solid #F6C453; }
  .row.flash { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { background: #F6C453; } 100% { background: #26254A; } }
  .rank { font-size: 34px; font-weight: 700; width: 76px; text-align: center; color: #F6C453; }
  .avatar { width: 104px; height: 78px; border-radius: 10px; object-fit: cover; border: 3px solid #F6C453; flex: 0 0 auto; }
  .avatar-blank {
    width: 104px; height: 78px; border-radius: 10px; background: #3D3B6B; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 26px; color: #B7B4E0;
  }
  .meta { flex: 1; }
  .status { font-size: 15px; color: #F6C453; font-weight: 700; }
  .score { font-size: 36px; font-weight: 700; color: #F6C453; white-space: nowrap; }
  .score .unit { font-size: 16px; font-weight: 500; }
  #quiz-tv { position: fixed; inset: 0; background: #1B1A2E; z-index: 50; display: none; padding: 36px 40px; overflow: auto; }
  #quiz-tv.show { display: block; }
  .qtv-title { font-size: 40px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .qtv-sub { font-size: 22px; text-align: center; color: #B7B4E0; margin-bottom: 18px; }
  .qtv-letters { display: flex; gap: 30px; justify-content: center; margin: 10px 0 20px; }
  .qtv-letter { width: 170px; height: 210px; border-radius: 14px; background: #FFF3B0; color: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 140px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .qtv-bar { max-width: 760px; height: 22px; border-radius: 999px; background: #3D3B6B; margin: 0 auto 10px; overflow: hidden; }
  .qtv-bar > div { height: 100%; background: #1D9E75; transition: width 0.25s linear; }
  .qtv-count { text-align: center; font-size: 30px; color: #F6C453; font-weight: 700; margin-bottom: 14px; }
  .qtv-ans { text-align: center; font-size: 56px; font-weight: 700; color: #F6C453; margin: 6px 0; }
  .qtv-photo { display: block; margin: 8px auto 14px; width: 260px; height: 195px; object-fit: contain; border-radius: 14px; background: #26254A; }
  .qtv-rank { max-width: 760px; margin: 0 auto; }
  .qtv-rank div { display: flex; justify-content: space-between; font-size: 28px; padding: 8px 20px; background: #26254A; border-radius: 14px; margin-bottom: 8px; }
  .qtv-rank div:first-child { border: 2px solid #F6C453; }
  .empty { text-align: center; font-size: 22px; color: #B7B4E0; margin-top: 80px; }
  .room-tag { text-align: center; font-size: 16px; color: #B7B4E0; margin-top: -14px; margin-bottom: 24px; }
  .room-overlay {
    position: fixed; inset: 0; background: rgba(10,10,20,0.75);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .room-card { background: #26254A; border-radius: 20px; padding: 28px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .room-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #FFFFFF; }
  .room-sub { font-size: 14px; color: #B7B4E0; margin-bottom: 16px; }
  .room-input { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 18px; box-sizing: border-box; text-align: center; margin-bottom: 14px; }
  .room-start-btn { width: 100%; padding: 12px; border-radius: 999px; border: none; background: #F6C453; color: #26254A; font-weight: 700; font-size: 16px; }
  .phase-tag { text-align: center; font-size: 22px; font-weight: 700; color: #F6C453; margin-top: -10px; margin-bottom: 22px; min-height: 28px; }
  .mode-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; }
  .mode-btn {
    padding: 10px 22px; border-radius: 999px; border: 2px solid #3D3B6B; background: #26254A;
    color: #B7B4E0; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .mode-btn.active { border-color: #F6C453; color: #F6C453; background: #3D3B6B; }
</style>
</head>
<body>
  <div id="room-overlay" class="room-overlay">
    <div class="room-card">
      <div class="room-title">教室コードを入力してください</div>
      <div class="room-sub">先生・生徒に配ったURLと同じコードを入れてください（例: 3-1）</div>
      <input type="text" id="room-code-input" class="room-input" placeholder="れい: 3-1">
      <button id="room-code-btn" class="room-start-btn">はじめる</button>
    </div>
  </div>
  <div class="title">🔠 イニシャルカード交換 ランキング</div>
  <div class="room-tag" id="room-tag"></div>
  <div class="phase-tag" id="phase-tag"></div>
  <div class="mode-row">
    <button class="mode-btn" id="mode-btn-clear" onclick="setMode('clear')">🏆 最初のクリア順</button>
    <button class="mode-btn" id="mode-btn-cards" onclick="setMode('laps')">🔁 周回数順</button>
  </div>
  <div id="quiz-tv"></div>
  <div class="board" id="board"></div>
  <div class="empty" id="empty" style="display:none;">まだ誰も参加していません</div>

<script>
var prevMatched = {};
var lastPhase = "";
var ROOM_KEY = "initial_tv_room";
var currentRoom = "";
var pollTimer = null;
var MODE_KEY = "initial_tv_mode";
var currentMode = localStorage.getItem(MODE_KEY) || "clear";
var lastStudents = [];

function getRoomFromUrl(){
  var m = location.search.match(/[?&]room=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
function startWithRoom(room){
  currentRoom = room;
  localStorage.setItem(ROOM_KEY, room);
  var url = new URL(location.href);
  url.searchParams.set("room", room);
  history.replaceState(null, "", url.toString());
  document.getElementById("room-tag").textContent = "教室コード: " + room;
  document.getElementById("room-overlay").style.display = "none";
  if(pollTimer) clearTimeout(pollTimer);
  poll();
}
document.getElementById("room-code-btn").onclick = function(){
  var v = document.getElementById("room-code-input").value.trim();
  if(!v) return;
  startWithRoom(v);
};

function updateModeButtons(){
  document.getElementById("mode-btn-clear").classList.toggle("active", currentMode === "clear");
  document.getElementById("mode-btn-cards").classList.toggle("active", currentMode === "laps");
}
function setMode(mode){
  currentMode = mode;
  localStorage.setItem(MODE_KEY, mode);
  updateModeButtons();
  renderCurrent();
}
window.setMode = setMode;
function sortStudents(students, mode){
  var list = students.slice();
  if(mode === "laps"){
    // 周回数が多い順。同じなら、早くその周回数に届いた順。
    list.sort(function(a, b){
      if((b.lapCount || 0) !== (a.lapCount || 0)) return (b.lapCount || 0) - (a.lapCount || 0);
      if(a.lapCount && b.lapCount) return a.lastLapAt - b.lastLapAt;
      if((b.matched || 0) !== (a.matched || 0)) return (b.matched || 0) - (a.matched || 0);
      return (a.registeredAt || 0) - (b.registeredAt || 0);
    });
  } else {
    // 最初のクリアが早かった順
    list.sort(function(a, b){
      if(a.clearedAt && b.clearedAt) return a.clearedAt - b.clearedAt;
      if(a.clearedAt && !b.clearedAt) return -1;
      if(!a.clearedAt && b.clearedAt) return 1;
      if((b.matched || 0) !== (a.matched || 0)) return (b.matched || 0) - (a.matched || 0);
      return (a.registeredAt || 0) - (b.registeredAt || 0);
    });
  }
  list.forEach(function(s, idx){ s.rank = idx + 1; });
  return list;
}
function renderCurrent(){
  // 終了したら、周回数の多い順（さいしゅう結果）で表示する
  render(sortStudents(lastStudents, lastMode === "single" ? "clear" : (lastPhase === "finished" ? "laps" : currentMode)));
}
var photoCache = {};
function photoSrc(s){
  if(!s.photo) return null;
  var c = photoCache[s.id];
  if(c && c !== "loading") return c;
  if(!c){
    photoCache[s.id] = "loading";
    fetch(s.photo).then(function(r){ if(!r.ok) throw new Error("x"); return r.blob(); })
      .then(function(b){ photoCache[s.id] = URL.createObjectURL(b); })
      .catch(function(){ delete photoCache[s.id]; });
  }
  return null;
}
function render(students){
  var board = document.getElementById("board");
  document.getElementById("empty").style.display = students.length ? "none" : "block";
  board.innerHTML = "";
  students.forEach(function(s, idx){
    var rankLabel = idx < 3 ? ["🥇","🥈","🥉"][idx] : ("#" + s.rank);
    var row = document.createElement("div");
    var cls = "row" + (idx === 0 ? " top1" : "");
    var progress = (s.lapCount || 0) * 10 + (s.matched || 0);
    if(prevMatched[s.id] !== undefined && progress > prevMatched[s.id]) cls += " flash";
    row.className = cls;
    row.innerHTML =
      '<div class="rank">' + rankLabel + '</div>' +
      (photoSrc(s) ? '<img class="avatar" src="' + photoSrc(s) + '">' : '<div class="avatar-blank">?</div>') +
      '<div class="meta">' +
        '<div class="status">' + (s.lapCount ? (lastMode === "single" ? "🎉 CLEAR!" : "🎉 " + s.lapCount + "周クリア！" + (s.hand ? "　いま " + (s.matched || 0) + " / 2" : "")) : (s.hand ? "" : (s.made ? "カードをまっています" : "カードづくり中"))) + '</div>' +
      '</div>' +
      '<div class="score">' + (s.lapCount ? (lastMode === "single" ? '<span class="unit">クリア ✓</span>' : s.lapCount + '<span class="unit"> 周</span>') : s.hand ? (s.matched || 0) + '<span class="unit"> / 2 まい</span>' : '<span class="unit">-</span>') + '</div>';
    board.appendChild(row);
    prevMatched[s.id] = progress;
  });
}

var lastMode = "endless";
function renderPhase(d){
  var el = document.getElementById("phase-tag");
  var total = (d.students || []).length;
  if(d.phase === "finished"){
    var lt = 0;
    (d.students || []).forEach(function(x){ lt += (x.lapCount || 0); });
    el.textContent = d.mode === "single"
      ? (d.autoFinished ? "🏁 みんな クリア！　しゅうりょう" : "🏁 しゅうりょう！　さいしゅう けっか")
      : "🏁 しゅうりょう！　さいしゅう けっか　（のべ " + lt + " 周）";
  } else if(d.phase === "playing"){
    var lapsTotal = 0;
    (d.students || []).forEach(function(x){ lapsTotal += (x.lapCount || 0); });
    el.textContent = d.mode === "single"
      ? "ゲーム中！　クリア " + (d.clearedCount || 0) + " / " + total + " 人"
      : "ゲーム中！　1周以上クリア " + (d.clearedCount || 0) + " / " + total + " 人　（のべ " + lapsTotal + " 周）";
  } else {
    el.textContent = "イニシャルカードを つくろう！　できた人 " + (d.madeCount || 0) + " / " + total + " 人";
  }
}
function poll(){
  fetch("/api/initial/state?room=" + encodeURIComponent(currentRoom))
    .then(function(r){ return r.json(); })
    .then(function(d){
      renderPhase(d);
      lastPhase = d.phase;
      lastMode = d.mode === "single" ? "single" : "endless";
      document.querySelector(".mode-row").style.display = lastMode === "single" ? "none" : "flex";
      lastStudents = d.students || [];
      renderCurrent();
    })
    .catch(function(){})
    .finally(function(){ pollTimer = setTimeout(poll, 2000); });
}

/* ---------- 🎯 イニシャルクイズ表示 ---------- */
var quizTvTimer = null, quizTvEndAt = 0, quizTvData = null;
function qesc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function renderQuizTv(q){
  quizTvData = q;
  var el = document.getElementById("quiz-tv");
  if(!q || q.state === "idle" || !q.letters){ el.className = ""; el.innerHTML = ""; return; }
  if(q.state === "question") quizTvEndAt = Date.now() + q.remainingMs;
  var html = '<div class="qtv-title">🎯 だれの イニシャルかな？</div>' +
    '<div class="qtv-letters"><div class="qtv-letter">' + q.letters[0] + '</div><div class="qtv-letter">' + q.letters[1] + '</div></div>';
  if(q.state === "question"){
    html += '<div class="qtv-bar"><div id="qtv-fill" style="width:100%"></div></div>' +
      '<div class="qtv-count" id="qtv-left"></div>' +
      '<div class="qtv-sub">じぶんの画面で せいかいを タップ！ はやいほど ポイントが たくさん！　（' + q.answered + ' / ' + q.players + ' にん こたえた）</div>';
  } else {
    html += '<div class="qtv-sub">こたえ</div><div class="qtv-ans">' + qesc(q.answer ? q.answer.name : "") + ' さん</div>' +
      (q.answer && q.answer.photo ? '<img class="qtv-photo" src="' + q.answer.photo + '" alt="">' : '') +
      '<div class="qtv-rank">' + (q.ranking || []).filter(function(r){ return r.played > 0; }).slice(0, 5).map(function(r){
        return '<div><span>' + r.rank + 'い　' + qesc(r.name) + '</span><b>' + r.points + ' pt</b></div>';
      }).join("") + '</div>';
  }
  el.innerHTML = html;
  el.className = "show";
  tickQuizTv();
}
function tickQuizTv(){
  if(!quizTvData || quizTvData.state !== "question") return;
  var left = Math.max(0, quizTvEndAt - Date.now());
  var f = document.getElementById("qtv-fill");
  if(f) f.style.width = Math.min(100, left / (quizTvData.duration * 1000) * 100) + "%";
  var t = document.getElementById("qtv-left");
  if(t) t.textContent = left > 0 ? "のこり " + Math.ceil(left / 1000) + " びょう" : "じかんぎれ！　でも せいかいなら 100pt もらえるよ";
}
setInterval(tickQuizTv, 250);
function pollQuizTv(){
  clearTimeout(quizTvTimer);
  if(!currentRoom){ quizTvTimer = setTimeout(pollQuizTv, 2000); return; }
  fetch("/api/initial/quiz?room=" + encodeURIComponent(currentRoom))
    .then(function(r){ return r.json(); })
    .then(renderQuizTv)
    .catch(function(){})
    .finally(function(){ quizTvTimer = setTimeout(pollQuizTv, (quizTvData && quizTvData.state === "question") ? 1000 : 2500); });
}
pollQuizTv();

(function boot(){
  updateModeButtons();
  var urlRoom = getRoomFromUrl();
  var savedRoom = localStorage.getItem(ROOM_KEY) || "";
  if(urlRoom){
    startWithRoom(urlRoom);
  } else if(savedRoom){
    startWithRoom(savedRoom);
  } else {
    document.getElementById("room-overlay").style.display = "flex";
  }
})();
</script>
</body>
</html>
