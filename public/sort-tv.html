<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルファベット なかまわけ（TV） - ALPHABET</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #1B1A2E; color: #FFFFFF; margin: 0; padding: 36px;
  }
  .title { font-size: 42px; font-weight: 700; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
  .room-tag { text-align: center; font-size: 16px; color: #B7B4E0; margin-top: -14px; margin-bottom: 20px; }
  .phase-tag { text-align: center; font-size: 24px; font-weight: 700; color: #F6C453; margin-bottom: 24px; min-height: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; max-width: 1500px; margin: 0 auto; }
  .card { background: #26254A; border-radius: 20px; padding: 16px 18px; }
  .card.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { background: #F6C453; } 100% { background: #26254A; } }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 84px; height: 63px; border-radius: 8px; object-fit: cover; border: 3px solid #F6C453; flex: 0 0 auto; }
  .avatar-blank { width: 84px; height: 63px; border-radius: 8px; background: #3D3B6B; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: 0 0 auto; }
  .who { font-size: 26px; font-weight: 700; flex: 1; }
  .likes { font-size: 22px; font-weight: 700; color: #F6C453; }
  .grp { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--gb); border-left: 8px solid var(--gc); margin-bottom: 8px; }
  .card .grp { margin-bottom: 0; }
  .card .letters span { width: 44px; height: 52px; font-size: 30px; }
  .grp-title { font-size: 22px; font-weight: 700; color: #2C2C2A; flex: 1 1 100%; }
  .letters { display: flex; flex-wrap: wrap; gap: 5px; }
  .likes-inline { font-size: 15px; color: #854F0B; font-weight: 700; margin-left: 8px; }
  .spot-prog { text-align: center; font-size: 30px; font-weight: 700; color: #B7B4E0; margin-bottom: 8px; }
  .letters span { width: 36px; height: 42px; border-radius: 8px; background: #FFFFFF; border: 3px solid var(--gc); color: #2C2C2A; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .empty { text-align: center; font-size: 26px; color: #B7B4E0; margin-top: 80px; line-height: 1.8; }
  #spot { position: fixed; inset: 0; background: #1B1A2E; z-index: 50; display: none; padding: 30px 50px; overflow: auto; }
  #spot.show { display: block; }
  .spot-top { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 22px; }
  .spot-top .avatar { width: 150px; height: 113px; }
  .spot-top .avatar-blank { width: 150px; height: 113px; font-size: 40px; }
  .spot-who { font-size: 56px; font-weight: 700; }
  .spot-likes { font-size: 36px; font-weight: 700; color: #F6C453; }
  .spot-groups { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 18px; }
  .spot-groups .likes-inline { font-size: 30px; }
  .spot-groups .grp { padding: 16px 22px; margin-bottom: 0; border-left-width: 14px; }
  .spot-groups .grp-title { font-size: 40px; }
  .spot-groups .letters { gap: 10px; }
  .spot-groups .letters span { width: 76px; height: 90px; font-size: 56px; border-radius: 14px; border-width: 4px; }
  .spot-quiz { text-align: center; font-size: 34px; font-weight: 700; color: #F6C453; margin-bottom: 18px; }
  .card { cursor: pointer; }
  #zoom { position: fixed; inset: 0; background: #1B1A2E; z-index: 60; display: none; padding: 30px 50px; overflow: auto; cursor: pointer; }
  #zoom.show { display: block; }
  #zoom .zoom-hint { text-align: center; color: #B7B4E0; font-size: 20px; margin-top: 22px; }
  .similar { max-width: 1100px; margin: 34px auto 0; }
  .similar-h { font-size: 30px; font-weight: 700; color: #F6C453; text-align: center; margin-bottom: 14px; }
  .sim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
  .sim-card { background: #26254A; border-radius: 16px; padding: 12px 14px; }
  .sim-card .head { margin-bottom: 8px; }
  .sim-card .who { font-size: 28px; }
  .sim-tag { font-size: 20px; font-weight: 700; color: #1B1A2E; background: #F6C453; border-radius: 999px; padding: 2px 12px; }
  .sim-tag.near { background: #B7B4E0; }
  .sim-card .grp { margin-bottom: 0; }
  .sim-card .letters span { width: 44px; height: 52px; font-size: 30px; }
  .room-overlay { position: fixed; inset: 0; background: rgba(10,10,20,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .room-card { background: #26254A; border-radius: 20px; padding: 28px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .room-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #FFFFFF; }
  .room-sub { font-size: 14px; color: #B7B4E0; margin-bottom: 16px; }
  .room-input { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 18px; box-sizing: border-box; text-align: center; margin-bottom: 14px; }
  .room-start-btn { width: 100%; padding: 12px; border-radius: 999px; border: none; background: #F6C453; color: #26254A; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <div id="room-overlay" class="room-overlay" style="display:none;">
    <div class="room-card">
      <div class="room-title">教室コードを入力してください</div>
      <div class="room-sub">先生・生徒に配ったURLと同じコードを入れてください（例: 3-1）</div>
      <input type="text" id="room-code-input" class="room-input" placeholder="れい: 3-1">
      <button id="room-code-btn" class="room-start-btn">はじめる</button>
    </div>
  </div>
  <div class="title">🔤 アルファベット なかまわけ</div>
  <div class="room-tag" id="room-tag"></div>
  <div class="phase-tag" id="phase-tag"></div>
  <div id="zoom"></div>
  <div id="spot"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;"></div>

<script>
var GCOL = ["#185FA5", "#1D9E75", "#D85A30", "#7F77DD", "#B7791F", "#B8458A", "#3B8E9E", "#6B7D1F"];
var GBG = ["#E6F1FB", "#E1F5EE", "#FBEAE3", "#EEEDFE", "#FAF0D7", "#F9E6F0", "#E3F2F5", "#EEF3D8"];
var ROOM_KEY = "sort_tv_room";
var currentRoom = "";
var pollTimer = null;
var seen = {};
var firstLoad = true;
var lastKey = "";

function getRoomFromUrl(){
  var m = location.search.match(/[?&]room=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
}
function startWithRoom(room){
  currentRoom = room;
  localStorage.setItem(ROOM_KEY, room);
  var url = new URL(location.href);
  url.searchParams.set("room", room);
  history.replaceState(null, "", url.toString());
  document.getElementById("room-tag").textContent = "教室コード: " + room;
  document.getElementById("room-overlay").style.display = "none";
  if(pollTimer) clearTimeout(pollTimer);
  poll();
}
document.getElementById("room-code-btn").onclick = function(){
  var v = document.getElementById("room-code-input").value.trim();
  if(!v) return;
  startWithRoom(v);
};
function who(it){ return it.anon ? "だれかの わけかた" : (it.role === "teacher" ? "先生" : (it.no ? it.no + "ばん" : "?")); }
function avatar(it){
  return it.photo ? '<img class="avatar" src="' + it.photo + '" alt="">' : '<div class="avatar-blank">' + (it.anon ? "👤" : "🙂") + '</div>';
}
function groupBlock(g, gi, hide, big){
  return '<div class="grp" style="--gc:' + GCOL[gi % GCOL.length] + ';--gb:' + GBG[gi % GBG.length] + '">' +
    '<div class="grp-title">' + (hide ? "？？？" : esc(g.name || "（なまえなし）")) + (g.likes ? ' <span class="likes-inline">👍 ' + g.likes + '</span>' : '') + '</div>' +
    '<div class="letters">' + (g.letters || []).map(function(L){ return "<span>" + L + "</span>"; }).join("") + '</div></div>';
}
function similarBlock(d, hide){
  var sim = d.similar || [];
  if(!sim.length) return "";
  return '<div class="similar"><div class="similar-h">👥 おなじ・にている わけかたを した人</div><div class="sim-grid">' +
    sim.map(function(x, i){
      var it = { id: x.sid, no: x.no, role: x.role, photo: x.photo };
      return '<div class="sim-card"><div class="head">' + avatar(it) + '<div class="who">' + who(it) + '</div>' +
        '<span class="sim-tag' + (x.same ? '' : ' near') + '">' + (x.same ? "おなじ！" : "にてる！") + '</span></div>' +
        groupBlock({ name: x.name, letters: x.letters, likes: 0 }, i + 1, !!hide, false) + '</div>';
    }).join("") + '</div></div>';
}
var zoomRef = null, lastCards = [];
function updateZoom(d, items, hideAll){
  var z = document.getElementById("zoom");
  var found = null;
  if(zoomRef && !d.spot){
    items.forEach(function(it){
      if(it.id !== zoomRef.sid) return;
      it.groups.forEach(function(g, gi){ if(g.gid === zoomRef.gid) found = { it: it, g: g, gi: gi }; });
    });
  }
  if(!found){ zoomRef = null; z.className = ""; z.innerHTML = ""; return; }
  z.innerHTML =
    (found.it.anon ? '' : '<div class="spot-top">' + avatar(found.it) + '<div class="spot-who">' + who(found.it) + ' の わけかた</div></div>') +
    '<div class="spot-groups">' + groupBlock(found.g, found.gi, hideAll, true) + '</div>' +
    '<div class="zoom-hint">（どこかを タップすると もどります）</div>';
  z.className = "show";
}
document.addEventListener("click", function(e){
  var z = document.getElementById("zoom");
  if(zoomRef){ zoomRef = null; z.className = ""; z.innerHTML = ""; return; }
  var el = e.target;
  while(el && el !== document.body){
    if(el.getAttribute && el.getAttribute("data-ci") !== null){
      var c = lastCards[parseInt(el.getAttribute("data-ci"), 10)];
      if(c && lastD){
        zoomRef = { sid: c.it.id, gid: c.g.gid };
        lastKey = "";
        updateZoom(lastD, lastD.items || [], !!lastD.hideTitles);
      }
      return;
    }
    el = el.parentNode;
  }
});
var lastD = null;
function render(d){
  lastD = d;
  var items = d.items || [];
  var spotItem = null, spotGroup = null, spotIdx = 0;
  if(d.spot){
    spotItem = items.filter(function(x){ return x.id === d.spot.sid; })[0] || null;
    if(spotItem){
      spotItem.groups.forEach(function(g, i){ if(g.gid === d.spot.gid){ spotGroup = g; spotIdx = i; } });
    }
  }
  var tag = document.getElementById("phase-tag");
  var pickCount = (d.picks || []).length;
  tag.textContent = d.phase !== "open"
    ? "いま みんなで かんがえ中…　みせた人 " + (d.sharedCount || 0) + " / " + (d.total || 0) + " 人"
    : (pickCount ? "📌 ピックアップ　（" + pickCount + " こ）" : "みんなの わけかた　（" + (d.groupCount || 0) + " こ）");
  var key = JSON.stringify([d.phase, d.spot, d.similar, d.picks, d.hideTitles, d.revealed, d.quiz, items.map(function(x){ return [x.id, x.no, x.groups.map(function(g){ return [g.gid, g.at, g.likes]; })]; })]);
  if(key === lastKey) return;
  lastKey = key;

  var hideAll = !!d.hideTitles;
  var hideSpot = hideAll && !d.revealed;
  var spot = document.getElementById("spot");
  if(spotItem && spotGroup){
    spot.innerHTML =
      (d.quiz ? '<div class="spot-prog">🎯 もんだい ' + (d.quiz.i + 1) + ' / ' + d.quiz.n + '</div>' : '') +
      '<div class="spot-top">' + avatar(spotItem) + '<div class="spot-who">' + who(spotItem) + ' の わけかた</div>' +
      (spotGroup.likes ? '<div class="spot-likes">👍 ' + spotGroup.likes + '</div>' : '') + '</div>' +
      (hideSpot ? '<div class="spot-quiz">🙈 どんな ルールで わけたのかな？ かんがえてみよう！</div>' : '<div class="spot-quiz">✅ こたえ</div>') +
      '<div class="spot-groups">' + groupBlock(spotGroup, spotIdx, hideSpot, true) + '</div>' +
      similarBlock(d, hideSpot);
    spot.className = "show";
  } else {
    spot.className = "";
    spot.innerHTML = "";
  }

  updateZoom(d, items, hideAll);
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  if(d.phase !== "open"){
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.innerHTML = "✏️ じぶんで かんがえて、グループに わけよう！<br>できた グループから「みんなに みせる」を おしてね";
    return;
  }
  var picks = d.picks || [];
  var picked = picks.length > 0;
  // 生徒ごとではなく、グループ1つずつを 独立した カードで 出す
  var cards = [];
  if(picked){
    picks.forEach(function(q){
      var it = items.filter(function(x){ return x.id === q.sid; })[0];
      if(!it) return;
      var gi = -1;
      it.groups.forEach(function(g, i){ if(g.gid === q.gid) gi = i; });
      if(gi >= 0) cards.push({ it: it, g: it.groups[gi], gi: gi });
    });
  } else {
    items.forEach(function(it){
      it.groups.forEach(function(g, gi){ cards.push({ it: it, g: g, gi: gi }); });
    });
  }
  empty.style.display = cards.length ? "none" : "block";
  empty.textContent = picked ? "ピックアップした グループが ありません" : "まだ だれも みせていません";
  lastCards = cards;
  grid.innerHTML = cards.map(function(c, ci){
    var stamp = c.g.gid + c.g.at;
    var fresh = !firstLoad && !seen[stamp];
    var head = c.it.anon ? "" :
      '<div class="head">' + avatar(c.it) + '<div class="who">' + who(c.it) + '</div></div>';
    return '<div class="card' + (fresh ? " flash" : "") + '" data-ci="' + ci + '">' + head +
      groupBlock(c.g, c.gi, hideAll, false) + '</div>';
  }).join("");
  cards.forEach(function(c){ seen[c.g.gid + c.g.at] = true; });
  firstLoad = false;
}
function poll(){
  fetch("/api/sort/state?view=tv&room=" + encodeURIComponent(currentRoom))
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){})
    .finally(function(){ pollTimer = setTimeout(poll, 2000); });
}
(function boot(){
  var urlRoom = getRoomFromUrl();
  var savedRoom = localStorage.getItem(ROOM_KEY) || "";
  if(urlRoom){ startWithRoom(urlRoom); }
  else if(savedRoom){ startWithRoom(savedRoom); }
  else { document.getElementById("room-overlay").style.display = "flex"; }
})();
</script>
</body>
</html>
