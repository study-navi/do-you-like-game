<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビンゴよみあげ - Do you like ...? ゲーム</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #F1EFE8; color: #2C2C2A; margin: 0; padding: 20px;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 640px; }
  .title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .room-tag { text-align: center; font-size: 13px; color: #888780; margin-bottom: 20px; }
  .card {
    background: #FFFFFF; border-radius: 20px; padding: 22px; margin-bottom: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  .size-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 4px; }
  .size-btn {
    flex: 1; padding: 10px; border-radius: 12px; border: 2px solid #D3D1C7;
    background: #FFFFFF; color: #5F5E5A; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .size-btn.active { border-color: #185FA5; background: #E6F1FB; color: #185FA5; }
  .size-hint { text-align: center; font-size: 12px; color: #B4B2A9; margin-bottom: 4px; }
  .current-word-box {
    text-align: center; background: #F1EFE8; border-radius: 16px; padding: 26px 16px; margin-bottom: 16px;
  }
  .current-word-icon { font-size: 44px; color: #185FA5; }
  .current-word-en { font-size: 28px; font-weight: 700; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .current-word-ja { font-size: 15px; color: #888780; margin-top: 4px; }
  .current-word-empty { color: #B4B2A9; font-size: 15px; padding: 20px 0; }
  .speak-btn {
    border: none; background: #EEEDFE; color: #534AB7; width: 34px; height: 34px;
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1; flex: 0 0 auto; cursor: pointer;
  }
  .next-btn {
    width: 100%; padding: 20px; font-size: 20px; font-weight: 700; border-radius: 999px;
    border: none; background: #185FA5; color: #FFFFFF; cursor: pointer; transition: transform 0.1s;
  }
  .next-btn:active { transform: scale(0.97); }
  .next-btn:disabled { background: #D3D1C7; cursor: default; }
  .progress-text { text-align: center; font-size: 13px; color: #888780; margin-top: 10px; }
  .history-title { font-size: 14px; font-weight: 600; color: #5F5E5A; margin-bottom: 10px; }
  .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .history-chip {
    background: #F1EFE8; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #5F5E5A;
    display: flex; align-items: center; gap: 5px;
  }
  .history-empty { color: #B4B2A9; font-size: 13px; }
  .footer-row { text-align: center; margin-top: 6px; }
  .reset-btn { font-size: 13px; padding: 8px 16px; color: #993C1D; background: #FAECE7; border: none; border-radius: 999px; cursor: pointer; }
  .room-overlay {
    position: fixed; inset: 0; background: rgba(44,44,42,0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .room-card { background: #FFFFFF; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
  .room-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .room-sub { font-size: 13px; color: #888780; margin-bottom: 16px; }
  .room-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #D3D1C7; font-size: 16px; box-sizing: border-box; text-align: center; margin-bottom: 14px; }
  .room-start-btn { width: 100%; padding: 12px; border-radius: 999px; border: 2px solid #185FA5; background: #E6F1FB; color: #185FA5; font-weight: 600; font-size: 15px; cursor: pointer; }
  .ranking-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F1EFE8;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-rank {
    width: 24px; height: 24px; border-radius: 50%; background: #EEEDFE; color: #534AB7;
    font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .ranking-photo {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: #F1EFE8;
  }
  .ranking-photo-placeholder { display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .ranking-lines { font-size: 14px; font-weight: 600; color: #185FA5; flex: 1; }
  .ranking-bingo-badge {
    background: #FDF3D8; color: #A9740A; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; flex: 0 0 auto;
  }
  .ranking-empty { color: #B4B2A9; font-size: 13px; }
</style>
</head>
<body>
<div id="room-overlay" class="room-overlay">
  <div class="room-card">
    <div class="room-title">教室コードを入力してください</div>
    <div class="room-sub">生徒に配ったURLと同じコードを入れてください（例: 3-1）</div>
    <input type="text" id="room-code-input" class="room-input" placeholder="れい: 3-1">
    <button id="room-code-btn" class="room-start-btn">はじめる</button>
  </div>
</div>

<div class="app">
  <div class="title">🎯 ビンゴ よみあげ（先生用）</div>
  <div class="room-tag" id="room-tag"></div>

  <div class="card">
    <div class="size-hint">マスの数（生徒の画面にも反映されます）</div>
    <div class="size-row">
      <button class="size-btn" data-size="3" onclick="chooseSize(3)">3×3</button>
      <button class="size-btn" data-size="4" onclick="chooseSize(4)">4×4</button>
      <button class="size-btn" data-size="5" onclick="chooseSize(5)">5×5</button>
    </div>
  </div>

  <div class="card">
    <div class="current-word-box" id="current-word-box">
      <div class="current-word-empty">「つぎの単語」を押してスタート</div>
    </div>
    <button class="next-btn" id="next-btn" onclick="callNext()">つぎの単語</button>
    <div class="progress-text" id="progress-text"></div>
  </div>

  <div class="card">
    <div class="history-title">ランキング（はやくビンゴ順・ライン数）</div>
    <div id="ranking-list"><span class="ranking-empty">まだ登録した生徒がいません</span></div>
  </div>

  <div class="card">
    <div class="history-title">よみあげた単語</div>
    <div class="history-list" id="history-list"><span class="history-empty">まだありません</span></div>
  </div>

  <div class="footer-row">
    <button class="reset-btn" onclick="resetBingo()">さいしょから やりなおす</button>
  </div>
</div>

<script>
var items = [
  {en:"soccer", ja:"サッカー", icon:"ti-ball-football", category:"sports"},
  {en:"baseball", ja:"やきゅう", icon:"ti-ball-baseball", category:"sports"},
  {en:"basketball", ja:"バスケ", icon:"ti-ball-basketball", category:"sports"},
  {en:"volleyball", ja:"バレーボール", icon:"ti-ball-volleyball", category:"sports"},
  {en:"tennis", ja:"テニス", icon:"ti-ball-tennis", category:"sports"},
  {en:"swimming", ja:"すいえい", icon:"ti-swimming", category:"sports"},
  {en:"running", ja:"かけっこ", icon:"ti-run", category:"sports"},
  {en:"ice cream", ja:"アイスクリーム", icon:"ti-ice-cream", category:"food"},
  {en:"pudding", ja:"プリン", icon:"ti-cake", category:"food"},
  {en:"milk", ja:"ぎゅうにゅう", icon:"ti-milk", category:"food"},
  {en:"pizza", ja:"ピザ", icon:"ti-pizza", category:"food"},
  {en:"hamburgers", ja:"ハンバーガー", icon:"ti-burger", category:"food"},
  {en:"apples", ja:"りんご", icon:"ti-apple", category:"food"},
  {en:"tomatoes", ja:"トマト", icon:"ti-plant", category:"food"},
  {en:"carrots", ja:"にんじん", icon:"ti-carrot", category:"food"},
  {en:"lemons", ja:"レモン", icon:"ti-lemon", category:"food"},
  {en:"dogs", ja:"いぬ", icon:"ti-dog", category:"animal"},
  {en:"cats", ja:"ねこ", icon:"ti-cat", category:"animal"},
  {en:"music", ja:"おんがく", icon:"ti-music", category:"animal"},
  {en:"blue", ja:"あお", swatch:"#378ADD", category:"color"},
  {en:"light blue", ja:"みずいろ", swatch:"#8ECAE6", category:"color"},
  {en:"red", ja:"あか", swatch:"#E24B4A", category:"color"},
  {en:"green", ja:"みどり", swatch:"#639922", category:"color"},
  {en:"light green", ja:"きみどり", swatch:"#A9C23F", category:"color"},
  {en:"yellow", ja:"きいろ", swatch:"#FAC775", category:"color"},
  {en:"pink", ja:"ピンク", swatch:"#ED93B1", category:"color"},
  {en:"purple", ja:"むらさき", swatch:"#7F77DD", category:"color"},
  {en:"orange", ja:"オレンジ", swatch:"#EF9F27", category:"color"},
  {en:"black", ja:"くろ", swatch:"#2C2C2A", category:"color"},
  {en:"white", ja:"しろ", swatch:"#FFFFFF", category:"color"}
];

var ROOM_KEY = "bingo_teacher_room";
var currentRoom = "";
var currentSize = 3;
var calledWords = [];

function getRoomFromUrl(){
  var m = location.search.match(/[?&]room=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function findItem(en){
  for(var i = 0; i < items.length; i++){ if(items[i].en === en) return items[i]; }
  return null;
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function iconHtml(it, size){
  if(!it) return "";
  return it.swatch
    ? '<span style="display:inline-block;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + it.swatch + ';border:1px solid #D3D1C7;"></span>'
    : '<i class="ti ' + it.icon + '" style="font-size:' + size + 'px;color:#185FA5;"></i>';
}

function updateSizeButtons(){
  document.querySelectorAll(".size-btn").forEach(function(b){
    b.classList.toggle("active", Number(b.dataset.size) === currentSize);
  });
}

function renderCurrentWord(){
  var box = document.getElementById("current-word-box");
  if(calledWords.length === 0){
    box.innerHTML = '<div class="current-word-empty">「つぎの単語」を押してスタート</div>';
    return;
  }
  var last = calledWords[calledWords.length - 1];
  var it = findItem(last);
  box.innerHTML =
    '<div class="current-word-icon">' + iconHtml(it, 44) + '</div>' +
    '<div class="current-word-en">' + last + ' <button class="speak-btn" onclick="speak(\'' + last + '\')">🔊</button></div>' +
    '<div class="current-word-ja">' + (it ? it.ja : "") + '</div>';
}

function renderHistory(){
  var list = document.getElementById("history-list");
  if(calledWords.length === 0){
    list.innerHTML = '<span class="history-empty">まだありません</span>';
    return;
  }
  list.innerHTML = calledWords.slice().reverse().map(function(w, i){
    var it = findItem(w);
    return '<span class="history-chip">' + iconHtml(it, 16) + w + '</span>';
  }).join("");
}

function renderProgress(){
  document.getElementById("progress-text").textContent = calledWords.length + " / " + items.length + " 単語よみあげ済み";
}

function renderRanking(students){
  var list = document.getElementById("ranking-list");
  if(!students || students.length === 0){
    list.innerHTML = '<span class="ranking-empty">まだ登録した生徒がいません</span>';
    return;
  }
  list.innerHTML = students.map(function(s){
    var photoHtml = s.photo
      ? '<img class="ranking-photo" src="' + s.photo + '">'
      : '<span class="ranking-photo ranking-photo-placeholder">🙂</span>';
    var bingoBadge = s.bingoAt ? '<span class="ranking-bingo-badge">🎉 BINGO</span>' : "";
    return '<div class="ranking-row">' +
      '<span class="ranking-rank">' + s.rank + '</span>' +
      photoHtml +
      '<span class="ranking-lines">🎯 ' + s.lineCount + '本</span>' +
      bingoBadge +
      '</div>';
  }).join("");
}

function applyState(d){
  currentSize = d.size || 3;
  calledWords = d.calledWords || [];
  updateSizeButtons();
  renderCurrentWord();
  renderHistory();
  renderProgress();
  renderRanking(d.students || []);
  var nextBtn = document.getElementById("next-btn");
  nextBtn.disabled = calledWords.length >= items.length;
  nextBtn.textContent = nextBtn.disabled ? "ぜんぶよみあげました" : "つぎの単語";
}

function fetchState(){
  fetch("/api/bingo/state?room=" + encodeURIComponent(currentRoom))
    .then(function(r){ return r.json(); })
    .then(applyState)
    .catch(function(){});
}

function callNext(){
  var pool = items.map(function(it){ return it.en; });
  fetch("/api/bingo/call", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ room: currentRoom, pool: pool })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      applyState(d);
      if(d.word) speak(d.word);
      if(d.done) alert("ぜんぶの単語をよみあげました！");
    });
}

function chooseSize(size){
  if(calledWords.length > 0){
    if(!confirm("マスの数を変えると、よみあげた単語の記録がリセットされます。よろしいですか？")) return;
  }
  fetch("/api/bingo/size", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ room: currentRoom, size: size })
  }).then(function(r){ return r.json(); })
    .then(function(){ fetchState(); });
}
window.chooseSize = chooseSize;
window.callNext = callNext;
window.speak = speak;

function resetBingo(){
  if(!confirm("よみあげた単語の記録をぜんぶリセットしますか？")) return;
  fetch("/api/bingo/reset", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ room: currentRoom })
  }).then(function(r){ return r.json(); })
    .then(function(){ fetchState(); });
}
window.resetBingo = resetBingo;

function startWithRoom(room){
  currentRoom = room;
  localStorage.setItem(ROOM_KEY, room);
  var url = new URL(location.href);
  url.searchParams.set("room", room);
  history.replaceState(null, "", url.toString());
  document.getElementById("room-tag").textContent = "教室コード: " + room;
  document.getElementById("room-overlay").style.display = "none";
  fetchState();
}

document.getElementById("room-code-btn").onclick = function(){
  var v = document.getElementById("room-code-input").value.trim();
  if(!v){ alert("教室コードを入力してください"); return; }
  startWithRoom(v);
};

(function boot(){
  var urlRoom = getRoomFromUrl();
  var savedRoom = localStorage.getItem(ROOM_KEY) || "";
  if(urlRoom){
    startWithRoom(urlRoom);
  } else if(savedRoom){
    startWithRoom(savedRoom);
  } else {
    document.getElementById("room-overlay").style.display = "flex";
  }
})();
setInterval(function(){ if(currentRoom) fetchState(); }, 3000);
</script>
</body>
</html>
